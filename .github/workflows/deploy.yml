name: Auto Deploy to Target Repo

on:
  push:
    branches: [ "main" ] # या आपकी जो मुख्य ब्रांच हो (जैसे master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ secrets.TARGET_REPO }} target

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "target" \
            ./ target/

      - name: Restore CNAME
        run: |
          echo "rsh.gdsnotes.in" > target/CNAME

      - name: Commit and Push
        run: |
          cd target
          git add -A
          git commit -m "Auto update website from source repo" || echo "No changes to commit"
          git push

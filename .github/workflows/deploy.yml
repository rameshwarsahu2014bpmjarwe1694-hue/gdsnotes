name: Auto Deploy to GitHub Pages Repo

on:
  workflow_run:
    workflows:
      - "Build Signed Native APK"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ secrets.TARGET_REPO }} target

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='target/' \
            --exclude='*.apk' \
            --exclude='app-release.apk' \
            ./ target/

      - name: Restore CNAME
        run: |
          echo "rsh.gdsnotes.in" > target/CNAME

      - name: Commit and Push
        run: |
          cd target
          git add -A
          git commit -m "Auto update from source repo [skip ci]" || echo "No changes to commit"
          git push origin main || git push

name: Build Signed APK (Bubblewrap TWA)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
      - 'manifest.json'
      - 'icon-*.png'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK/AAB'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          cmdline-tools-version: 'latest'

      - name: Fix Android SDK layout for Bubblewrap
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/tools" ]; then
            ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/tools/bin" | head -n 20

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore
      - name: Create Native WebView workspace
        run: |
          mkdir -p webview-build

          mkdir -p webview-build/app/src/main/java
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values
          mkdir -p webview-build/app/src/main/res/xml
          mkdir -p webview-build/gradle/wrapper

          echo "===================================="
          echo "Native WebView workspace created."
          find webview-build -type d | sort
          echo "===================================="
      - name: Generate Gradle project files
        run: |
          cat > webview-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GDSNotes"
          include ':app'
          EOF

          cat > webview-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > webview-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "===== settings.gradle ====="
          cat webview-build/settings.gradle

          echo "===== build.gradle ====="
          cat webview-build/build.gradle

          echo "===== gradle.properties ====="
          cat webview-build/gradle.properties
      - name: Generate app build.gradle
        run: |
          cat > webview-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'in.gdsnotes.rsh'
              compileSdk 34

              defaultConfig {
                  applicationId "in.gdsnotes.rsh"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity:1.9.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          touch webview-build/app/proguard-rules.pro

          echo "===== app/build.gradle ====="
          cat webview-build/app/build.gradle
      - name: Generate AndroidManifest.xml
        run: |
          mkdir -p webview-build/app/src/main

          cat > webview-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GDS Notes"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.GDSNotes">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>

                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "===== AndroidManifest.xml ====="
          cat webview-build/app/src/main/AndroidManifest.xml
      
      - name: Generate MainActivity.java
        run: |
          mkdir -p webview-build/app/src/main/java/in/gdsnotes/rsh

          cat > webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java <<'EOF'
          package in.gdsnotes.rsh;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ProgressBar;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private View offlineLayout;
              private ValueCallback<Uri[]> filePathCallback;
              private Button btnRetry;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                      registerForActivityResult(
                              new ActivityResultContracts.StartActivityForResult(),
                              result -> {

                                  if (filePathCallback == null)
                                      return;

                                  Uri[] results = null;

                                  if (result.getResultCode() == Activity.RESULT_OK &&
                                          result.getData() != null) {

                                      Uri uri = result.getData().getData();

                                      if (uri != null) {
                                          results = new Uri[]{uri};
                                      }
                                  }

                                  filePathCallback.onReceiveValue(results);
                                  filePathCallback = null;
                              });

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  offlineLayout = findViewById(R.id.offlineLayout);
                  btnRetry = findViewById(R.id.btnRetry);
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(WebView webView,
                                                       ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {

                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          fileChooserLauncher.launch(intent);

                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);

                          progressBar.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.VISIBLE);
                          offlineLayout.setVisibility(View.GONE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view,
                                                   WebResourceRequest request,
                                                   WebResourceError error) {
                          super.onReceivedError(view, request, error);

                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);

                          webView.setVisibility(View.GONE);
                          offlineLayout.setVisibility(View.VISIBLE);
                      }
                  });

                  webView.loadUrl("https://rsh.gdsnotes.in");

                  swipeRefresh.setOnRefreshListener(() -> webView.reload());

                  btnRetry.setOnClickListener(v -> {
                      offlineLayout.setVisibility(View.GONE);
                      webView.reload();
                  });

                  getOnBackPressedDispatcher().addCallback(this,
                          new OnBackPressedCallback(true) {
                              @Override
                              public void handleOnBackPressed() {
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      finish();
                                  }
                              }
                          });
              }
          }
          EOF

          echo "===== MainActivity.java ====="
          cat webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java
      - name: Generate Android Resources
        run: |
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values

          cat > webview-build/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/swipeRefresh"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>

                  <ProgressBar
                      android:id="@+id/progressBar"
                      style="?android:attr/progressBarStyleLarge"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:layout_gravity="center"
                      android:visibility="gone"/>

                  <include
                      android:id="@+id/offlineLayout"
                      layout="@layout/network_error"
                      android:visibility="gone"/>

              </FrameLayout>

          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF
          cat > webview-build/app/src/main/res/layout/network_error.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#FFFFFF">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="No Internet Connection"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="#000000"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Please check your internet connection and try again."
                  android:textSize="16sp"
                  android:gravity="center"
                  android:textColor="#666666"/>

              <Button
                  android:id="@+id/btnRetry"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Retry"/>

          </LinearLayout>
          EOF
          cat > webview-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">GDS Notes</string>
          </resources>
          EOF

          cat > webview-build/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          cat > webview-build/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.GDSNotes"
                  parent="Theme.Material3.DayNight.NoActionBar">
              </style>
          </resources>
          EOF

          echo "===== Resources ====="
          find webview-build/app/src/main/res -type f | sort
      - name: Prepare Bubblewrap workspace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/twa-build/android.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p twa-build
          cp android.keystore twa-build/android.keystore
          cp twa-manifest.json twa-build/twa-manifest.json

          node -e "
          const fs=require('fs');
          const path='twa-build/twa-manifest.json';
          const m=JSON.parse(fs.readFileSync(path,'utf8'));
          m.signingKey=m.signingKey||{};
          m.signingKey.path=process.env.KEYSTORE_PATH;
          m.signingKey.alias=process.env.KEY_ALIAS;
          m.signingKey.storePassword=process.env.KEYSTORE_PASSWORD;
          m.signingKey.keyPassword=process.env.KEY_PASSWORD;
          fs.writeFileSync(path,JSON.stringify(m,null,2));
          console.log('Patched signingKey ->',m.signingKey);
          "
      - name: Patch LauncherActivity (Enable FLAG_SECURE)
        run: |
          FILE=$(find twa-build -name LauncherActivity.java | head -n 1)

          if [ -z "$FILE" ]; then
          echo "LauncherActivity not found!"
          exit 1
          fi

          echo "Found: $FILE"
          echo "Patching LauncherActivity..."

          # import add (safe check)
          if ! grep -q "WindowManager" "$FILE"; then
          sed -i '/^import android.os.Bundle;$/a import android.view.WindowManager;' "$FILE"
          fi

          # FLAG_SECURE inject (only once)
          if ! grep -q "FLAG_SECURE" "$FILE"; then
          awk '
          /onCreate\(.*\)/ { inMethod=1 }
          inMethod && /\{/ {
          print
          print "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);"
          inMethod=0
          next
          }
          { print }
          ' "$FILE" > tmp && mv tmp "$FILE"
          fi

          echo "Patch applied successfully."
      - name: Find LauncherActivity
        run: |
         find twa-build -name LauncherActivity.java
      - name: Show generated twa-manifest.json
        run: |
         cat twa-build/twa-manifest.json
         
      - name: Find launchUrl
        run: |
          grep -R "launchUrl" -n twa-build || true
          
      - name: Show generated build.gradle
        run: |
          sed -n '1,120p' twa-build/app/build.gradle

      - name: Show LauncherActivity.java
        run: |
         sed -n '1,200p' twa-build/app/src/main/java/io/gdsnote/rshtwa/LauncherActivity.java
      - name: Show AndroidManifest.xml
        run: |
         sed -n '1,200p' twa-build/app/src/main/AndroidManifest.xml

      - name: Show strings.xml
        run: |
         sed -n '1,200p' twa-build/app/src/main/res/values/strings.xml
      - name: Verify LauncherActivity
        run: |
         FILE=$(find twa-build -name LauncherActivity.java | head -n1)
         nl -ba "$FILE" | sed -n '1,40p'
      - name: Bubblewrap build (signed APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-build

          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cat twa-manifest.json
          printf "%s\n%s\n" \
           "$KEYSTORE_PASSWORD" \
           "$KEY_PASSWORD" \
          | bubblewrap build --skipPwaValidation
          echo "---- Build artifacts ----"
          find . -maxdepth 4 \( -name "*.apk" -o -name "*.aab" \) | sort

      - name: Locate output artifacts
        id: artifacts
        run: |
          cd twa-build
          APK_PATH=$(find . -maxdepth 4 -name "app-release-signed.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -maxdepth 4 -name "*.apk" | head -n1)
          fi
          AAB_PATH=$(find . -maxdepth 4 -name "*.aab" | head -n1)
          echo "apk_path=twa-build/${APK_PATH#./}" >> "$GITHUB_OUTPUT"
          echo "aab_path=twa-build/${AAB_PATH#./}" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-apk
          path: ${{ steps.artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-aab
          path: ${{ steps.artifacts.outputs.aab_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Show SHA256 fingerprint (for assetlinks.json)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA256|SHA1" || true

      - name: Create GitHub Release (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GDS Notes APK build ${{ github.run_number }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
          generate_release_notes: true

      - name: Build Summary
        run: |
          echo "================================="
          echo "Build completed successfully."
          echo "APK : ${{ steps.artifacts.outputs.apk_path }}"
          echo "AAB : ${{ steps.artifacts.outputs.aab_path }}"
          echo "================================="

          updateReceiver = new android.content.BroadcastReceiver() {
          @Override
          public void onReceive(Context context, Intent intent) {

            long id = intent.getLongExtra(
                DownloadManager.EXTRA_DOWNLOAD_ID,
                -1
           );

          if (id == updateDownloadId) {

            DownloadManager dm =
                    (DownloadManager) getSystemService(DOWNLOAD_SERVICE);

            if (dm == null) return;

            DownloadManager.Query query =
                    new DownloadManager.Query();

            query.setFilterById(updateDownloadId);

            android.database.Cursor cursor =
                    dm.query(query);

            if (cursor != null && cursor.moveToFirst()) {

                int uriIndex =
                        cursor.getColumnIndex(
                                DownloadManager.COLUMN_LOCAL_URI);

                if (uriIndex >= 0) {

                    String uri =
                            cursor.getString(uriIndex);

                    if (uri != null) {

                        installApk(new File(Uri.parse(uri).getPath()));

                    }

                }

                cursor.close();

            }

          }

          }
          };

          IntentFilter filter = new IntentFilter(
          DownloadManager.ACTION_DOWNLOAD_COMPLETE
          );

          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
          registerReceiver(
            updateReceiver,
            filter,
            Context.RECEIVER_NOT_EXPORTED
          );
          } else {
          registerReceiver(updateReceiver, filter);
          }
          getOnBackPressedDispatcher().addCallback(this,
                    new OnBackPressedCallback(true) {
                    @Override
                    public void handleOnBackPressed() {
                      if (webView.canGoBack()) {
                          webView.goBack();
                       } else {
                         finish();
                  }
               }
           });
           CookieManager.getInstance().setAcceptCookie(true);
          webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {

            String fileName = URLUtil.guessFileName(
                   url,
                  contentDisposition,
                  mimeType
            );

           Toast.makeText(
                 MainActivity.this,
                "Downloading...",
                 Toast.LENGTH_SHORT
           ).show();
            runOnUiThread(() -> Toast.makeText(MainActivity.this, "Listener Triggered", Toast.LENGTH_SHORT).show());
               downloadFile(url, fileName, null);

          });
          } catch (Throwable e) {

            new AlertDialog.Builder(this)
            .setTitle("App Crash")
            .setMessage(android.util.Log.getStackTraceString(e))
            .setCancelable(false)
            .setPositiveButton("OK", null)
            .show();
          }
          }
          private void checkForUpdates() {

          Executors.newSingleThreadExecutor().execute(() -> {

          try {

            URL url = new URL("https://rsh.gdsnotes.in/version.json");

            HttpURLConnection conn =
                    (HttpURLConnection) url.openConnection();

            conn.setRequestMethod("GET");
            conn.setConnectTimeout(10000);
            conn.setReadTimeout(10000);

            BufferedReader reader =
                    new BufferedReader(
                            new InputStreamReader(conn.getInputStream()));

            StringBuilder json = new StringBuilder();
            String line;

            while ((line = reader.readLine()) != null) {
                json.append(line);
            }

            reader.close();

            JSONObject object = new JSONObject(json.toString());

            int latestVersionCode =
                    object.getInt("versionCode");

            String latestVersionName =
                    object.getString("versionName");

            String apkUrl =
                    object.getString("apkUrl");

            String message =
                    object.getString("message");

                    if (latestVersionCode > BuildConfig.VERSION_CODE &&
                    !isFinishing() &&
                    !isDestroyed()) {

                new Handler(Looper.getMainLooper()).post(() -> {

                    showUpdateDialog(
                            latestVersionName,
                            message,
                            apkUrl
                    );

                });

            }

          } catch (Exception e) {
            e.printStackTrace();
          }

          });

          }
          private void showUpdateDialog(
           String versionName,
           String message,
           String apkUrl) {

          new AlertDialog.Builder(MainActivity.this)
            .setTitle("🎉 New Update Available")

            .setMessage(
                    "Current Version : "
                            + BuildConfig.VERSION_NAME
                            + "\n\nLatest Version : "
                            + versionName
                            + "\n\n"
                            + message)

            .setCancelable(false)

            .setPositiveButton("Update Now",
                    (dialog, which) -> {

                        downloadApk(apkUrl);

                    })

            .setNegativeButton("Later",
                    (dialog, which) -> {

                        dialog.dismiss();

                    })

            .show();
          }
          private void downloadApk(String apkUrl) {

           try {

          DownloadManager.Request request =
                new DownloadManager.Request(Uri.parse(apkUrl));

           request.setTitle("RSH GDS Notes Update");
           request.setDescription("Downloading latest version...");
           request.setNotificationVisibility(
                DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);

           request.setDestinationInExternalPublicDir(
                Environment.DIRECTORY_DOWNLOADS,
                "app-release.apk");

          request.setMimeType(
                "application/vnd.android.package-archive");

                DownloadManager manager =
                (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);

          if (manager != null) {
            updateDownloadId = manager.enqueue(request);

            Toast.makeText(
                    MainActivity.this,
                    "Update download started...",
                    Toast.LENGTH_LONG
            ).show();
          }

          } catch (Exception e) {

            Toast.makeText(
                MainActivity.this,
                e.getMessage(),
                Toast.LENGTH_LONG
            ).show();

          }

          }
          private void installApk(File apkFile) {

           try {

          Uri apkUri = FileProvider.getUriForFile(
                this,
                getPackageName() + ".fileprovider",
                apkFile
          );

          Intent intent = new Intent(Intent.ACTION_VIEW);

          intent.setDataAndType(
                apkUri,
                "application/vnd.android.package-archive"
          );

          intent.setFlags(
                Intent.FLAG_ACTIVITY_NEW_TASK
                        | Intent.FLAG_GRANT_READ_URI_PERMISSION
          );

          startActivity(intent);

          } catch (Exception e) {

          Toast.makeText(
                this,
                e.getMessage(),
                Toast.LENGTH_LONG
          ).show();

          }

          }
          private File createImageFile() throws IOException {

             String timeStamp = new SimpleDateFormat(
            "yyyyMMdd_HHmmss",
             Locale.getDefault()
             ).format(new Date());
 
            String imageFileName = "IMG_" + timeStamp + "_";

            File storageDir = getExternalFilesDir(Environment.DIRECTORY_PICTURES);

            return File.createTempFile(
            imageFileName,
            ".jpg",
            storageDir
          );
          }

          private void downloadFile(String fileUrl, String fileName, String token) {
              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Downloading...", Toast.LENGTH_SHORT).show());

              new Thread(() -> {
           try {
            String cookies = android.webkit.CookieManager.getInstance().getCookie(fileUrl);

            java.net.URL url = new java.net.URL(fileUrl.replace(" ", "%20"));
            java.net.HttpURLConnection connection = (java.net.HttpURLConnection) url.openConnection();
            
            connection.setInstanceFollowRedirects(true); 
            connection.setRequestProperty("X-Source-Auth", "RSH-GDS-SECURE-ACCESS");
            
            if (token != null && !token.isEmpty() && !token.equals("null")) {
                connection.setRequestProperty("Authorization", "Bearer " + token);
            }
            
            connection.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
            if (cookies != null && !cookies.isEmpty()) {
                connection.setRequestProperty("Cookie", cookies);
            }
            // Connection setup ke turant baad
            connection.setConnectTimeout(15000); // 15 seconds wait
            connection.setReadTimeout(15000);

            // Ye line add karein, ye batayega ki URL sahi se fetch ho raha hai ya nahi
                connection.setRequestMethod("GET"); 

            connection.connect();
            
            // --- DEBUG 1: Server Status Check ---
            int status = connection.getResponseCode();
            if (status != 200) { 
                runOnUiThread(() -> Toast.makeText(MainActivity.this, "Status Error: " + status, Toast.LENGTH_LONG).show()); 
                return; 
            }

            java.io.InputStream input = connection.getInputStream();
            
            android.content.ContentValues values = new android.content.ContentValues();
            values.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, fileName);

           // Naya Logic: Dynamic MIME Type detection
           String contentType = connection.getContentType();
           if (contentType == null || contentType.isEmpty() || contentType.contains(";")) {
               contentType = "application/pdf"; // Fallback for safety
            }
            values.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, contentType);

            values.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS);


            android.net.Uri uri = getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
            
            // --- DEBUG 2: URI Null Check ---
            if (uri == null) { 
                runOnUiThread(() -> Toast.makeText(MainActivity.this, "URI Null Error", Toast.LENGTH_LONG).show()); 
                return; 
            }
            
            if (uri != null) {
                java.io.OutputStream output = getContentResolver().openOutputStream(uri);
                if (output != null) {
                    byte[] buffer = new byte[4096];
                    int len;
                    while ((len = input.read(buffer)) != -1) {
                        output.write(buffer, 0, len);
                    }
                    output.flush();
                    output.close();
                }
                input.close();
                runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download Complete", Toast.LENGTH_LONG).show());
            }
                    } catch (Exception e) {
            // --- DEBUG 3: Detailed Exception Check ---
            String error = e.getClass().getSimpleName() + ": " + (e.getMessage() != null ? e.getMessage() : "null");
            runOnUiThread(() -> Toast.makeText(MainActivity.this, error, Toast.LENGTH_LONG).show());
          }

          }).start();
          }



       

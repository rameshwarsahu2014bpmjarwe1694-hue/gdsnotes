name: Build Signed APK (Bubblewrap TWA)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
      - 'manifest.json'
      - 'icon-*.png'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK/AAB'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
    
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses
          
      - name: Install Bubblewrap CLI
        run: |
         npm uninstall -g @bubblewrap/cli || true
         npm install -g @bubblewrap/cli@1.22.3
         yes n | bubblewrap --version
          

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDK_PATH=$SDK_PATH"

          test -d "$SDK_PATH"
          test -d "$SDK_PATH/platform-tools"
          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platforms"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath":"$JAVA_HOME",
            "androidSdkPath":"$SDK_PATH"
          }
          EOF

          echo "===== Bubblewrap Config ====="
          cat "$HOME/.bubblewrap/config.json"

          echo "===== Bubblewrap Doctor ====="
          bubblewrap updateConfig \
           --jdkPath "$JAVA_HOME" \
           --androidSdkPath "$ANDROID_SDK_ROOT"
          bubblewrap doctor || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

          ls -lh android.keystore

      - name: Create Workspace
        run: |
          mkdir -p twa-build
          cp android.keystore twa-build/

          if [ -f twa-manifest.json ]; then
            cp twa-manifest.json twa-build/
          fi

      - name: Initialize Bubblewrap Project
        run: |
          cd twa-build

          yes "" | bubblewrap init \
          --manifest="https://rameshwarsahu2014bpmjarwe1694-hue.github.io/gdsnotes/manifest.json" \
           --directory=.

          echo "===== Files ====="
          ls -la

          echo "===== Manifest ====="
          cat twa-manifest.json | head -60
      - name: Reconfigure Bubblewrap (after init)
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath":"$JAVA_HOME",
            "androidSdkPath":"$SDK_PATH"
          }
          EOF

          echo "===== Config ====="
          cat "$HOME/.bubblewrap/config.json"

          bubblewrap doctor || true

      - name: Patch Signing Key
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd twa-build

          node -e "
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
          m.signingKey=m.signingKey||{};
          m.signingKey.path='./android.keystore';
          m.signingKey.alias=process.env.KEY_ALIAS;
          fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2));
          console.log(m.signingKey);
          "

          echo "===== Updated Manifest ====="
          cat twa-manifest.json | head -40

      - name: Build Signed APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-build

          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$HOME/.bubblewrap"

          printf '{\n  "jdkPath":"%s",\n  "androidSdkPath":"%s"\n}\n' \
          "$JAVA_HOME" \
          "$ANDROID_SDK_ROOT" \
          > "$HOME/.bubblewrap/config.json"

          cat "$HOME/.bubblewrap/config.json"
          echo "===== SDK Contents ====="
          ls -la "$ANDROID_SDK_ROOT"

          echo "===== Build folders ====="
          find "$ANDROID_SDK_ROOT" -maxdepth 2 -type d | sort
          bubblewrap doctor

          printf "%s\n%s\n" \
          "$KEYSTORE_PASSWORD" \
          "$KEY_PASSWORD" \
          | bubblewrap build --skipPwaValidation

          echo "===== Build Output ====="

          find . -type f \
          \( -name "*.apk" -o -name "*.aab" \)

      - name: Locate APK and AAB
        id: artifacts
        run: |
          cd twa-build

          APK=$(find . -name "*.apk" | head -1)
          AAB=$(find . -name "*.aab" | head -1)

          echo "apk=twa-build/${APK#./}" >> $GITHUB_OUTPUT
          echo "aab=twa-build/${AAB#./}" >> $GITHUB_OUTPUT

          echo "APK=$APK"
          echo "AAB=$AAB"

      - name: Show Certificate Fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
          -keystore android.keystore \
          -alias "$KEY_ALIAS" \
          -storepass "$KEYSTORE_PASSWORD" \
          | grep -E "SHA256|SHA1"
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-apk
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-aab
          path: ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Build Files
        run: |
          echo "===== Uploaded Files ====="

          ls -lh "${{ steps.artifacts.outputs.apk }}" || true
          ls -lh "${{ steps.artifacts.outputs.aab }}" || true

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GDS Notes Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}

      - name: Build Summary
        run: |
          echo "================================="
          echo "Build completed successfully."
          echo "APK : ${{ steps.artifacts.outputs.apk }}"
          echo "AAB : ${{ steps.artifacts.outputs.aab }}"
          echo "=================================" 

name: Build Signed Native APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
      - 'manifest.json'
      - 'icon-*.png'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK/AAB'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          cmdline-tools-version: 'latest'
          
      - name: Install ImageMagick
        run: |
         sudo apt-get update
         sudo apt-get install -y imagemagick

         convert -version
         
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore
      - name: Create Native WebView workspace
        run: |
          mkdir -p webview-build

          mkdir -p webview-build/app/src/main/java
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values
          mkdir -p webview-build/app/src/main/res/xml
          mkdir -p webview-build/gradle/wrapper

          echo "===================================="
          echo "Native WebView workspace created."
          find webview-build -type d | sort
          echo "===================================="
      - name: Generate Gradle project files
        run: |
          cat > webview-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GDSNotes"
          include ':app'
          EOF

          cat > webview-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > webview-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "===== settings.gradle ====="
          cat webview-build/settings.gradle

          echo "===== build.gradle ====="
          cat webview-build/build.gradle

          echo "===== gradle.properties ====="
          cat webview-build/gradle.properties
      - name: Generate app build.gradle
        run: |
          cat > webview-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'in.gdsnotes.rsh'
              compileSdk 34

              defaultConfig {
                  applicationId "in.gdsnotes.rsh"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity:1.9.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.core:core-splashscreen:1.0.1'
          }
          EOF

          touch webview-build/app/proguard-rules.pro

          echo "===== app/build.gradle ====="
          cat webview-build/app/build.gradle
          
      - name: Verify Gradle Dependencies
        run: |
         grep "core-splashscreen" webview-build/app/build.gradle
      - name: Generate AndroidManifest.xml
        run: |
          mkdir -p webview-build/app/src/main

          cat > webview-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.GDSNotes">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>

                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "===== AndroidManifest.xml ====="
          cat webview-build/app/src/main/AndroidManifest.xml
      
      - name: Generate MainActivity.java
        run: |
          mkdir -p webview-build/app/src/main/java/in/gdsnotes/rsh

          cat > webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java <<'EOF'
          package in.gdsnotes.rsh;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.JsResult;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ProgressBar;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.app.AlertDialog;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import java.net.URL;
          import java.net.HttpURLConnection;
          import java.io.InputStream;
          import java.io.FileOutputStream;
          import java.io.File;
          import java.io.IOException;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import android.app.DownloadManager;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import android.content.Context;
          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private View offlineLayout;
              private ValueCallback<Uri[]> filePathCallback;
              private Button btnRetry;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                      registerForActivityResult(
                              new ActivityResultContracts.StartActivityForResult(),
                              result -> {

                                  if (filePathCallback == null)
                                      return;

                                  Uri[] results = null;

                                  if (result.getResultCode() == Activity.RESULT_OK &&
                                          result.getData() != null) {

                                      Uri uri = result.getData().getData();

                                      if (uri != null) {
                                          results = new Uri[]{uri};
                                      }
                                  }

                                  filePathCallback.onReceiveValue(results);
                                  filePathCallback = null;
                              });

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {

             SplashScreen.installSplashScreen(this);

            super.onCreate(savedInstanceState);
            setContentView(R.layout.activity_main);

                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  offlineLayout = findViewById(R.id.offlineLayout);
                  btnRetry = findViewById(R.id.btnRetry);
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(WebView webView,
                                                       ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {

                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          fileChooserLauncher.launch(intent);

                          return true;
                      }
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message,
                         JsResult result) {

                        new AlertDialog.Builder(MainActivity.this)
                            .setMessage(message)
                            .setPositiveButton("OK", (d, w) -> result.confirm())
                            .setCancelable(false)
                            .show();

                         return true;
                     }

                     @Override
                     public boolean onJsConfirm(WebView view, String url, String message,
                           JsResult result) {

                        new AlertDialog.Builder(MainActivity.this)
                            .setMessage(message)
                            .setPositiveButton("OK", (d, w) -> result.confirm())
                            .setNegativeButton("Cancel", (d, w) -> result.cancel())
                            .setCancelable(false)
                            .show();

                           return true;
                      }
                      
                  });

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);

                          progressBar.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.VISIBLE);
                          offlineLayout.setVisibility(View.GONE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view,
                            WebResourceRequest request,
                            WebResourceError error) {

                        super.onReceivedError(view, request, error);

                    // Sirf main page fail hone par offline screen dikhao
                    if (request.isForMainFrame()) {

                       progressBar.setVisibility(View.GONE);
                       swipeRefresh.setRefreshing(false);

                       webView.setVisibility(View.GONE);
                       offlineLayout.setVisibility(View.VISIBLE);
                   }
                 }
              });
                  
          webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");        
          webView.loadUrl("https://rsh.gdsnotes.in");

                  swipeRefresh.setOnRefreshListener(() -> webView.reload());
                  swipeRefresh.setOnChildScrollUpCallback(
                  (parent, child) -> webView.getScrollY() > 0
                  );
                  btnRetry.setOnClickListener(v -> {
                      offlineLayout.setVisibility(View.GONE);
                      webView.reload();
                  });

          getOnBackPressedDispatcher().addCallback(this,
                    new OnBackPressedCallback(true) {
                    @Override
                    public void handleOnBackPressed() {
                      if (webView.canGoBack()) {
                          webView.goBack();
                       } else {
                         finish();
                  }
               }
           });
 
          webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {

            String fileName = URLUtil.guessFileName(
                   url,
                  contentDisposition,
                  mimeType
            );

           Toast.makeText(
                 MainActivity.this,
                "Downloading...",
                 Toast.LENGTH_SHORT
           ).show();

               downloadFile(url, fileName);

          });

          }

          /* ================= DOWNLOAD HELPER ================= */

          private void downloadFile(String fileUrl, String fileName) {

              new Thread(() -> {

          try {

            URL url = new URL(fileUrl);

            HttpURLConnection connection =
                    (HttpURLConnection) url.openConnection();

            connection.setRequestProperty(
                    "x-source-auth",
                    "RSH-GDS-SECURE-ACCESS"
            );

            String cookies =
                    CookieManager.getInstance().getCookie(fileUrl);

            if (cookies != null) {
                connection.setRequestProperty("Cookie", cookies);
            }

            connection.connect();

            InputStream input = connection.getInputStream();

            File file = new File(
                    Environment.getExternalStoragePublicDirectory(
                            Environment.DIRECTORY_DOWNLOADS
                    ),
                    fileName
            );

            FileOutputStream output = new FileOutputStream(file);

            byte[] buffer = new byte[8192];
            int len;

            while ((len = input.read(buffer)) != -1) {
                output.write(buffer, 0, len);
            }

            output.flush();
            output.close();
            input.close();

            runOnUiThread(() ->
                    Toast.makeText(
                            MainActivity.this,
                            "Download Complete",
                            Toast.LENGTH_LONG
                    ).show()
             );

          } catch (IOException e) {

            runOnUiThread(() ->
                    Toast.makeText(
                            MainActivity.this,
                            e.getMessage(),
                            Toast.LENGTH_LONG
                    ).show()
              );
           }

          }).start();
          }

          private class AndroidBridge {

             @JavascriptInterface
             public void download(String url, String fileName) {

                 runOnUiThread(() -> {

               Toast.makeText(
                    MainActivity.this,
                    "Downloading...",
                    Toast.LENGTH_SHORT
            ).show();

                    downloadFile(url, fileName);

              });
             }
           }
          }
          EOF

          echo "===== MainActivity.java ====="
          cat webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java
          
      - name: Verify Generated MainActivity
        run: |
         echo "===== Package ====="
         grep "^package " webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java

         echo ""
         echo "===== Splash API ====="
         grep -n "SplashScreen.installSplashScreen" webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java

    

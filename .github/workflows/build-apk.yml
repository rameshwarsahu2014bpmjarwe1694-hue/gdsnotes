name: Build Signed Native APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
      - 'manifest.json'
      - 'icon-*.png'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK/AAB'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          cmdline-tools-version: 'latest'
          
      - name: Install ImageMagick
        run: |
         sudo apt-get update
         sudo apt-get install -y imagemagick

         convert -version
         
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore
      - name: Create Native WebView workspace
        run: |
          mkdir -p webview-build

          mkdir -p webview-build/app/src/main/java
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values
          mkdir -p webview-build/app/src/main/res/xml
          mkdir -p webview-build/gradle/wrapper

          echo "===================================="
          echo "Native WebView workspace created."
          find webview-build -type d | sort
          echo "===================================="
      - name: Generate Gradle project files
        run: |
          cat > webview-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GDSNotes"
          include ':app'
          EOF

          cat > webview-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > webview-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "===== settings.gradle ====="
          cat webview-build/settings.gradle

          echo "===== build.gradle ====="
          cat webview-build/build.gradle

          echo "===== gradle.properties ====="
          cat webview-build/gradle.properties
      - name: Generate app build.gradle
        run: |
          cat > webview-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'in.gdsnotes.rsh'
              compileSdk 34

              defaultConfig {
                  applicationId "in.gdsnotes.rsh"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity:1.9.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.core:core-splashscreen:1.0.1'
          }
          EOF

          touch webview-build/app/proguard-rules.pro

          echo "===== app/build.gradle ====="
          cat webview-build/app/build.gradle
          
      - name: Verify Gradle Dependencies
        run: |
         grep "core-splashscreen" webview-build/app/build.gradle
      - name: Generate AndroidManifest.xml
        run: |
          mkdir -p webview-build/app/src/main

          cat > webview-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.GDSNotes">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>

                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "===== AndroidManifest.xml ====="
          cat webview-build/app/src/main/AndroidManifest.xml
      
      - name: Generate MainActivity.java
        run: |
          mkdir -p webview-build/app/src/main/java/in/gdsnotes/rsh

          cat > webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java <<'EOF'
          package in.gdsnotes.rsh;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.JsResult;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ProgressBar;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.app.AlertDialog;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import android.app.DownloadManager;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import android.content.Context;
          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private View offlineLayout;
              private ValueCallback<Uri[]> filePathCallback;
              private Button btnRetry;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                      registerForActivityResult(
                              new ActivityResultContracts.StartActivityForResult(),
                              result -> {

                                  if (filePathCallback == null)
                                      return;

                                  Uri[] results = null;

                                  if (result.getResultCode() == Activity.RESULT_OK &&
                                          result.getData() != null) {

                                      Uri uri = result.getData().getData();

                                      if (uri != null) {
                                          results = new Uri[]{uri};
                                      }
                                  }

                                  filePathCallback.onReceiveValue(results);
                                  filePathCallback = null;
                              });

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {

             SplashScreen.installSplashScreen(this);

            super.onCreate(savedInstanceState);
            setContentView(R.layout.activity_main);

                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  offlineLayout = findViewById(R.id.offlineLayout);
                  btnRetry = findViewById(R.id.btnRetry);
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(WebView webView,
                                                       ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {

                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          fileChooserLauncher.launch(intent);

                          return true;
                      }
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message,
                         JsResult result) {

                        new AlertDialog.Builder(MainActivity.this)
                            .setMessage(message)
                            .setPositiveButton("OK", (d, w) -> result.confirm())
                            .setCancelable(false)
                            .show();

                         return true;
                     }

                     @Override
                     public boolean onJsConfirm(WebView view, String url, String message,
                           JsResult result) {

                        new AlertDialog.Builder(MainActivity.this)
                            .setMessage(message)
                            .setPositiveButton("OK", (d, w) -> result.confirm())
                            .setNegativeButton("Cancel", (d, w) -> result.cancel())
                            .setCancelable(false)
                            .show();

                           return true;
                      }
                      
                  });

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);

                          progressBar.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.VISIBLE);
                          offlineLayout.setVisibility(View.GONE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view,
                            WebResourceRequest request,
                            WebResourceError error) {

                        super.onReceivedError(view, request, error);

                    // Sirf main page fail hone par offline screen dikhao
                    if (request.isForMainFrame()) {

                       progressBar.setVisibility(View.GONE);
                       swipeRefresh.setRefreshing(false);

                       webView.setVisibility(View.GONE);
                       offlineLayout.setVisibility(View.VISIBLE);
                   }
                 }

                  
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {

                  DownloadManager.Request request =
                     new DownloadManager.Request(Uri.parse(url));

                  request.setMimeType(mimeType);
                  request.addRequestHeader("User-Agent", userAgent);

                  String fileName = URLUtil.guessFileName(
                       url,
                       contentDisposition,
                       mimeType
                 );

                 request.setTitle(fileName);
                 request.setDescription("Downloading...");
                 request.setNotificationVisibility(
            DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                );

                request.setDestinationInExternalPublicDir(
                    Environment.DIRECTORY_DOWNLOADS,
                    fileName
               );

           DownloadManager dm =
               (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);

           if (dm != null) {
           dm.enqueue(request);
           Toast.makeText(
                MainActivity.this,
                "Download started",
                Toast.LENGTH_SHORT
          ).show();
          }
          });
          webView.loadUrl("https://rsh.gdsnotes.in");

                  swipeRefresh.setOnRefreshListener(() -> webView.reload());
                  swipeRefresh.setOnChildScrollUpCallback(
                  (parent, child) -> webView.getScrollY() > 0
                  );
                  btnRetry.setOnClickListener(v -> {
                      offlineLayout.setVisibility(View.GONE);
                      webView.reload();
                  });

                  getOnBackPressedDispatcher().addCallback(this,
                          new OnBackPressedCallback(true) {
                              @Override
                              public void handleOnBackPressed() {
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      finish();
                                  }
                              }
                          });
              }
          }
          EOF

          echo "===== MainActivity.java ====="
          cat webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java
          
      - name: Verify Generated MainActivity
        run: |
         echo "===== Package ====="
         grep "^package " webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java

         echo ""
         echo "===== Splash API ====="
         grep -n "SplashScreen.installSplashScreen" webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java

         echo ""
         echo "===== onCreate ====="
         grep -n "protected void onCreate" webview-build/app/src/main/java/in/gdsnotes/rsh/MainActivity.java
         
      - name: Generate Android Resources
        run: |
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values
          mkdir -p webview-build/app/src/main/res/drawable
          mkdir -p webview-build/app/src/main/res/mipmap-anydpi-v26
          mkdir -p webview-build/app/src/main/res/mipmap-hdpi
          mkdir -p webview-build/app/src/main/res/mipmap-mdpi
          mkdir -p webview-build/app/src/main/res/mipmap-xhdpi
          mkdir -p webview-build/app/src/main/res/mipmap-xxhdpi
          mkdir -p webview-build/app/src/main/res/mipmap-xxxhdpi
          convert icon-512.png -resize 48x48 \
          webview-build/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert icon-512.png -resize 48x48 \
          webview-build/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          convert icon-512.png -resize 72x72 \
          webview-build/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert icon-512.png -resize 72x72 \
          webview-build/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          convert icon-512.png -resize 96x96 \
          webview-build/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert icon-512.png -resize 96x96 \
          webview-build/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          convert icon-512.png -resize 144x144 \
          webview-build/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert icon-512.png -resize 144x144 \
          webview-build/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          convert icon-512.png -resize 192x192 \
          webview-build/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          convert icon-512.png -resize 192x192 \
          webview-build/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          convert icon-512.png -resize 432x432 \
          webview-build/app/src/main/res/drawable/ic_launcher_foreground.png
          file webview-build/app/src/main/res/mipmap-*/ic_launcher.png
          cat > webview-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
          <background android:drawable="@android:color/white"/>
          <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > webview-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
          <background android:drawable="@android:color/white"/>
          <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > webview-build/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/swipeRefresh"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">

                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>

                  <ProgressBar
                      android:id="@+id/progressBar"
                      style="?android:attr/progressBarStyleLarge"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:layout_gravity="center"
                      android:visibility="gone"/>

                  <include
                      android:id="@+id/offlineLayout"
                      layout="@layout/network_error"
                      android:visibility="gone"/>

              </FrameLayout>

          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF
          cat > webview-build/app/src/main/res/layout/network_error.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#FFFFFF">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="No Internet Connection"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="#000000"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Please check your internet connection and try again."
                  android:textSize="16sp"
                  android:gravity="center"
                  android:textColor="#666666"/>

              <Button
                  android:id="@+id/btnRetry"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Retry"/>

          </LinearLayout>
          EOF
          cat > webview-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name"> RSH GDS Notes</string>
          </resources>
          EOF

          cat > webview-build/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          cat > webview-build/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">

             <style name="Theme.GDSNotes"
              parent="Theme.Material3.DayNight.NoActionBar">

          <!-- Android 12+ Splash -->
          <item name="android:windowSplashScreenBackground">@android:color/white</item>
          <item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_launcher_foreground</item>
          <item name="android:windowSplashScreenAnimationDuration">300</item>

          <!-- Normal Background -->
          <item name="android:windowBackground">@android:color/white</item>

            </style>

          </resources>
          EOF
          echo "===== Resources ====="
          find webview-build/app/src/main/res -type f | sort
      - name: Debug Launcher Icons
        run: |
         echo "========== Mipmap Files =========="
         find webview-build/app/src/main/res -type f | grep mipmap | sort

         echo ""
         echo "========== File Sizes =========="
         ls -lh webview-build/app/src/main/res/mipmap-*/ic_launcher*
    
         echo ""
         echo "========== Adaptive Icon XML =========="
         cat webview-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

         echo ""
         echo "========== Round Icon XML =========="
         cat webview-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

         echo ""
         echo "========== PNG Info =========="
         file webview-build/app/src/main/res/mipmap-*/ic_launcher.png || true
      - name: Download Gradle Wrapper
        run: |
          cd webview-build
          gradle wrapper --gradle-version 8.10
      - name: Configure Release Signing
        run: |
          cat >> webview-build/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("../../android.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
      - name: Build Native APK & AAB
        run: |
          cd webview-build
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          
      - name: Verify APK Contents
        run: |
         APK=$(find webview-build/app/build/outputs/apk/release -name "*.apk" | head -1)

         echo "===== APK Resources ====="
         unzip -l "$APK" | grep -E "ic_launcher|mipmap|themes|AndroidManifest" || true

         echo ""
         echo "===== Manifest Strings ====="
         strings "$APK" | grep "Theme.GDSNotes" || true

         echo ""
         echo "===== Splash ====="
         strings "$APK" | grep "windowSplash" || true

      - name: Verify Manifest
        run: |
          strings webview-build/app/build/outputs/apk/release/app-release.apk | grep -E "Theme.GDSNotes|ic_launcher|roundIcon|windowSplash"
         
      - name: Inspect APK Icons
        run: |
         APK=$(find webview-build/app/build/outputs/apk/release -name "*.apk" | head -n1)

         echo "APK = $APK"

         unzip -l "$APK" | grep -E "mipmap|ic_launcher|round|splash" || true
      - name: Locate output artifacts
        id: artifacts
        run: |
          cd webview-build
          APK_PATH=$(find . -maxdepth 4 -name "app-release-signed.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -maxdepth 4 -name "*.apk" | head -n1)
          fi
          AAB_PATH=$(find . -maxdepth 4 -name "*.aab" | head -n1)
          echo "apk_path=webview-build/${APK_PATH#./}" >> "$GITHUB_OUTPUT"
          echo "aab_path=webview-build/${AAB_PATH#./}" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"
      - name: Verify Final APK Icons
        run: |
         APK=$(find webview-build/app/build/outputs/apk/release -name "*.apk" | head -1)

         echo "===== Launcher Resources in APK ====="
         unzip -l "$APK" | grep ic_launcher || true

         echo ""
         echo "===== PNG Resources ====="
         unzip -l "$APK" | grep png || true
         
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-apk
          path: ${{ steps.artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-aab
          path: ${{ steps.artifacts.outputs.aab_path }}
          if-no-files-found: warn
          retention-days: 30

      - name: Show SHA256 fingerprint (for assetlinks.json)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA256|SHA1" || true

      - name: Create GitHub Release (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GDS Notes APK build ${{ github.run_number }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
          generate_release_notes: true

      - name: Build Summary
        run: |
          echo "================================="
          echo "Build completed successfully."
          echo "APK : ${{ steps.artifacts.outputs.apk_path }}"
          echo "AAB : ${{ steps.artifacts.outputs.aab_path }}"
          echo "================================="

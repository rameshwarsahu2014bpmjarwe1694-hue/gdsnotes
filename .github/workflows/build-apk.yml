      - name: Download Gradle Wrapper
        run: |
          cd webview-build
          gradle wrapper --gradle-version 8.10

      - name: Build Native APK & AAB
        run: |
          cd webview-build
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Locate output artifacts
        id: artifacts
        run: |
          cd webview-build
          APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n1)
          AAB_PATH=$(find . -path "*/outputs/bundle/release/*.aab" | head -n1)

          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
              echo "Build artifacts missing!"
              exit 1
          fi

          echo "apk_path=webview-build/${APK_PATH#./}" >> "$GITHUB_OUTPUT"
          echo "aab_path=webview-build/${AAB_PATH#./}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-apk
          path: ${{ steps.artifacts.outputs.apk_path }}
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdsnotes-signed-aab
          path: ${{ steps.artifacts.outputs.aab_path }}
          retention-days: 30

      - name: Commit latest APK to repo
        run: |
          cp webview-build/app/build/outputs/apk/release/app-release.apk app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-release.apk
          git commit -m "Update latest compiled APK" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create GitHub Release (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GDS Notes APK build ${{ github.run_number }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
          generate_release_notes: true
          

name: Build Signed Native APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
      - 'manifest.json'
      - 'icon-*.png'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK/AAB'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          cmdline-tools-version: 'latest'
          
      - name: Install ImageMagick
        run: |
         sudo apt-get update
         sudo apt-get install -y imagemagick
         convert -version
         
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -lh android.keystore

      - name: Create Native WebView workspace
        run: |
          mkdir -p webview-build/app/src/main/java
          mkdir -p webview-build/app/src/main/res/layout
          mkdir -p webview-build/app/src/main/res/values
          mkdir -p webview-build/app/src/main/res/xml
          mkdir -p webview-build/gradle/wrapper

      - name: Generate Gradle project files
        run: |
          cat > webview-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GDSNotes"
          include ':app'
          EOF

          cat > webview-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > webview-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Generate app build.gradle
        run: |
          cat > webview-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.gdsnote.rshtwa'
              compileSdk 34

              defaultConfig {
                  applicationId "io.gdsnote.rshtwa"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "1.6"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              signingConfigs {
                  release {
                      storeFile file("../../android.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  viewBinding true
                  buildConfig true
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity:1.9.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.core:core-splashscreen:1.0.1'
          }
          EOF

          cat > webview-build/app/proguard-rules.pro <<'EOF'
          -assumenosideeffects class android.util.Log {
              public static *** d(...);
              public static *** v(...);
              public static *** i(...);
              public static *** w(...);
              public static *** e(...);
          }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -renamesourcefileattribute SourceFile
          -keepattributes SourceFile,LineNumberTable
          -repackageclasses ''
          -allowaccessmodification
          EOF

      - name: Generate AndroidManifest.xml
        run: |
          mkdir -p webview-build/app/src/main

          cat > webview-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              
              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:theme="@style/Theme.GDSNotes">
                  
                  <activity
                      android:name="io.gdsnote.rshtwa.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data
                             android:scheme="https"
                             android:host="rsh.gdsnotes.in"
                             android:pathPrefix="/" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>

              </application>
          </manifest>
          EOF

      - name: Generate MainActivity.java
        run: |
          mkdir -p webview-build/app/src/main/java/io/gdsnote/rshtwa

          cat > webview-build/app/src/main/java/io/gdsnote/rshtwa/MainActivity.java <<'EOF'
          package io.gdsnote.rshtwa;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.JsResult;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ProgressBar;
          import android.widget.FrameLayout;
          import android.webkit.PermissionRequest;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.app.AlertDialog;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import java.io.File;
          import java.io.IOException;
          import android.webkit.CookieManager;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import android.app.DownloadManager;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import android.content.Context;
          import android.content.IntentFilter;
          import android.view.WindowManager;
          import android.provider.MediaStore;
          import androidx.core.content.FileProvider;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.Executors;
          import android.os.Handler;
          import android.os.Looper;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private View offlineLayout;
              private ValueCallback<Uri[]> filePathCallback;
              private Button btnRetry;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private FrameLayout fullscreenContainer;
              private Uri cameraImageUri;
              private long updateDownloadId = -1;
              private android.content.BroadcastReceiver updateReceiver;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
              registerForActivityResult(
                new ActivityResultContracts.StartActivityForResult(),
                result -> {
                    if (filePathCallback == null) return;
                    Uri[] results = null;

                    if (result.getResultCode() == Activity.RESULT_OK) {
                        if (result.getData() != null && result.getData().getData() != null) {
                            results = new Uri[]{ result.getData().getData() };
                        } else if (cameraImageUri != null) {
                            results = new Uri[]{ cameraImageUri };
                        }
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                });

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);
                  
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
                  setContentView(R.layout.activity_main);

                  fullscreenContainer = new FrameLayout(this);
                  fullscreenContainer.setLayoutParams(
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );
                  addContentView(fullscreenContainer, fullscreenContainer.getLayoutParams());
                  fullscreenContainer.setVisibility(View.GONE);

                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  offlineLayout = findViewById(R.id.offlineLayout);
                  btnRetry = findViewById(R.id.btnRetry);
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  webView.setHapticFeedbackEnabled(false);
                  webView.setLongClickable(false);
                  settings.setDomStorageEnabled(true);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      CookieManager.getInstance().setAcceptThirdPartyCookies(webView, false);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  }
                  
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN) {
                      settings.setAllowFileAccessFromFileURLs(false);
                      settings.setAllowUniversalAccessFromFileURLs(false);
                  }
                  
                  settings.setLoadsImagesAutomatically(true);
                  settings.setBlockNetworkImage(false);
                  settings.setBlockNetworkLoads(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      settings.setSafeBrowsingEnabled(true);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                         WebView webView,
                         ValueCallback<Uri[]> filePathCallback,
                         FileChooserParams fileChooserParams) {

                          MainActivity.this.filePathCallback = filePathCallback;

                          try {
                              File photoFile = createImageFile();
                              cameraImageUri = FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".fileprovider",
                                  photoFile
                              );

                              Intent cameraIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                              cameraIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraImageUri);
                              cameraIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              cameraIntent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);

                              Intent galleryIntent = new Intent(Intent.ACTION_GET_CONTENT);
                              galleryIntent.setType("*/*");
                              galleryIntent.addCategory(Intent.CATEGORY_OPENABLE);

                              Intent chooser = Intent.createChooser(galleryIntent, "Select File");
                              chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cameraIntent});

                              fileChooserLauncher.launch(chooser);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Unable to open file chooser", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (d, w) -> result.confirm())
                              .setCancelable(false)
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (d, w) -> result.confirm())
                              .setNegativeButton("Cancel", (d, w) -> result.cancel())
                              .setCancelable(false)
                              .show();
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          fullscreenContainer.addView(view);
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.GONE);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.removeView(customView);
                          fullscreenContainer.setVisibility(View.GONE);
                          customView = null;
                          webView.setVisibility(View.VISIBLE);
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                              customViewCallback = null;
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, android.webkit.SslErrorHandler handler, android.net.http.SslError error) {
                          handler.cancel();
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          progressBar.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.VISIBLE);
                          offlineLayout.setVisibility(View.GONE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.clearMatches();
                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          Uri uri = request.getUrl();
                          String host = uri.getHost();

                          if (url.startsWith("view-source:")) {
                              Toast.makeText(MainActivity.this, "Access Denied!", Toast.LENGTH_SHORT).show();
                              return true;
                          }

                          // UPI Deep-Link
                          if (url.startsWith("upi://") || url.startsWith("gpay://") || url.startsWith("phonepe://") || url.startsWith("paytmmp://") || url.startsWith("paytm://") || url.contains("pay?pa=")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW);
                                  intent.setData(Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "No UPI app found!", Toast.LENGTH_LONG).show();
                              }
                              return true;
                          }

                          if (host != null && !host.endsWith("gdsnotes.in") && !host.equals("wa.me") && !host.equals("api.whatsapp.com")) {
                              Intent browser = new Intent(Intent.ACTION_VIEW, uri);
                              startActivity(browser);
                              return true;
                          }

                          if (url.startsWith("mailto:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_SENDTO, Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "No email app found", Toast.LENGTH_SHORT).show();
                              }
                              return true;
                          }

                          if (url.startsWith("tel:")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_DIAL, Uri.parse(url));
                                  startActivity(intent);
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Unable to open dialer", Toast.LENGTH_SHORT).show();
                              }
                              return true;
                          }

                          if (url.startsWith("https://wa.me/") || url.startsWith("https://api.whatsapp.com/") || url.startsWith("whatsapp://")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  intent.setPackage("com.whatsapp");
                                  startActivity(intent);
                              } catch (Exception e) {
                                  Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(browserIntent);
                              }
                              return true;
                          }

                          view.loadUrl(url);
                          return true;
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, android.webkit.RenderProcessGoneDetail detail) {
                          view.destroy();
                          recreate();
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) {
                              progressBar.setVisibility(View.GONE);
                              swipeRefresh.setRefreshing(false);
                              webView.setVisibility(View.GONE);
                              offlineLayout.setVisibility(View.VISIBLE);
                          }
                      }
                  });

                  webView.setOnLongClickListener(v -> true);
                  webView.setLongClickable(false);
                  webView.clearCache(false);
                  
                  Intent intent = getIntent();
                  if (intent != null && intent.getData() != null) {
                      webView.loadUrl(intent.getData().toString());
                  } else {
                      webView.loadUrl("https://rsh.gdsnotes.in");
                  }

                  swipeRefresh.setOnRefreshListener(() -> webView.reload());
                  swipeRefresh.setOnChildScrollUpCallback((parent, child) -> webView.getScrollY() > 0);
                  
                  btnRetry.setOnClickListener(v -> {
                      offlineLayout.setVisibility(View.GONE);
                      webView.reload();
                  });

                  updateReceiver = new android.content.BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                          if (id == updateDownloadId && updateDownloadId != -1) {
                              installApkFromDownloadManager(id);
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(updateReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(updateReceiver, filter);
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              finish();
                          }
                      }
                  });

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      downloadFile(url, fileName, null);
                  });

                  checkForUpdates();
              }
              private void checkForUpdates() {
                  Executors.newSingleThreadExecutor().execute(() -> {
                      try {
                          URL url = new URL("https://rsh.gdsnotes.in/version.json");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(15000);

                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder json = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) json.append(line);
                          reader.close();

                          JSONObject object = new JSONObject(json.toString());
                          int latestVersionCode = object.getInt("versionCode");
                          String latestVersionName = object.getString("versionName");
                          String apkUrl = object.getString("apkUrl");
                          String message = object.getString("message");

                          if (latestVersionCode > BuildConfig.VERSION_CODE && !isFinishing() && !isDestroyed()) {
                              new Handler(Looper.getMainLooper()).post(() -> 
                                  showUpdateDialog(latestVersionName, message, apkUrl)
                              );
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              private void showUpdateDialog(String versionName, String message, String apkUrl) {
                  new AlertDialog.Builder(MainActivity.this)
                      .setTitle("🎉 New Update Available")
                      .setMessage("Current Version : " + BuildConfig.VERSION_NAME + "\n\nLatest Version : " + versionName + "\n\n" + message)
                      .setCancelable(false)
                      .setPositiveButton("Update Now", (dialog, which) -> downloadApk(apkUrl))
                      .setNegativeButton("Later", (dialog, which) -> dialog.dismiss())
                      .show();
              }

              private void downloadApk(String apkUrl) {
                  try {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(apkUrl));
                      String safeApkName = "app-release-" + System.currentTimeMillis() + ".apk";
                      request.setTitle("RSH GDS Notes Update");
                      request.setDescription("Downloading latest version...");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, safeApkName);
                      request.setMimeType("application/vnd.android.package-archive");

                      DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (manager != null) {
                          updateDownloadId = manager.enqueue(request);
                          Toast.makeText(MainActivity.this, "Update download started...", Toast.LENGTH_LONG).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(MainActivity.this, "Download error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void installApkFromDownloadManager(long downloadId) {
                  try {
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      if (dm == null) return;
                      Uri apkUri = dm.getUriForDownloadedFile(downloadId);

                      if (apkUri != null) {
                          Intent installIntent = new Intent(Intent.ACTION_VIEW);
                          installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                          installIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(installIntent);
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Unable to launch installer: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private File createImageFile() throws IOException {
                  String timeStamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(new Date());
                  String imageFileName = "IMG_" + timeStamp + "_";
                  File storageDir = getExternalFilesDir(Environment.DIRECTORY_PICTURES);
                  return File.createTempFile(imageFileName, ".jpg", storageDir);
              }

              private void downloadFile(String fileUrl, String fileName, String token) {
                  Toast.makeText(MainActivity.this, "Downloading...", Toast.LENGTH_SHORT).show();

                  new Thread(() -> {
                      try {
                          String cookies = CookieManager.getInstance().getCookie(fileUrl);
                          URL url = new URL(fileUrl.replace(" ", "%20"));
                          HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                          
                          connection.setInstanceFollowRedirects(true);
                          connection.setRequestProperty("X-Source-Auth", "RSH-GDS-SECURE-ACCESS");
                          if (token != null && !token.isEmpty() && !token.equals("null")) {
                              connection.setRequestProperty("Authorization", "Bearer " + token);
                          }
                          connection.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
                          if (cookies != null && !cookies.isEmpty()) {
                              connection.setRequestProperty("Cookie", cookies);
                          }
                          connection.setConnectTimeout(60000);
                          connection.setReadTimeout(60000);
                          connection.setRequestMethod("GET");
                          connection.connect();

                          int status = connection.getResponseCode();
                          if (status != 200) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Status Error: " + status, Toast.LENGTH_LONG).show());
                              return;
                          }

                          java.io.InputStream input = connection.getInputStream();
                          android.content.ContentValues values = new android.content.ContentValues();
                          values.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, fileName);

                          String rawContentType = connection.getContentType();
                          String contentType = (rawContentType == null || rawContentType.isEmpty() || rawContentType.contains(";")) ? "application/pdf" : rawContentType;
                          values.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, contentType);
                          values.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              java.io.OutputStream output = getContentResolver().openOutputStream(uri);
                              if (output != null) {
                                  byte[] buffer = new byte[4096];
                                  int len;
                                  while ((len = input.read(buffer)) != -1) {
                                      output.write(buffer, 0, len);
                                  }
                                  output.flush();
                                  output.close();
                              }
                              input.close();

                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  if (isFinishing() || isDestroyed()) return;
                                  Toast.makeText(MainActivity.this, "Download Complete", Toast.LENGTH_SHORT).show();

                                  try {
                                      Intent openIntent = new Intent(Intent.ACTION_VIEW);
                                      openIntent.setDataAndType(uri, contentType);
                                      openIntent.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(Intent.createChooser(openIntent, "Open File With..."));
                                  } catch (Exception e) {
                                      Toast.makeText(MainActivity.this, "File saved in Downloads", Toast.LENGTH_SHORT).show();
                                  }
                              }, 200);
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download failed", Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }
          }
          EOF

name: Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath":"$JAVA_HOME",
            "androidSdkPath":"$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          bubblewrap doctor

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Init project
        run: |
          yes "" | bubblewrap init \
            --manifest=https://rameshwarsahu2014bpmjarwe1694-hue.github.io/gdsnotes/manifest.json \
            --directory=twa-build

      - name: Copy keystore
        run: |
          cp android.keystore twa-build/android.keystore

      - name: Patch manifest
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd twa-build
          node -e "
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('twa-manifest.json'));
          m.signingKey={
            path:'./android.keystore',
            alias:process.env.KEY_ALIAS
          };
          fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2));
          "

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-build
          printf "%s\n%s\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" | bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: twa-build/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Signed-AAB
          path: twa-build/**/*.aab

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="320">
<meta name="format-detection" content="telephone=no">
<title>RAMESHWAR SAHU EXAM APP</title>
<style>
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;
    background:#fff;color:#09090b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px;line-height:1.45;word-wrap:break-word;overflow-wrap:break-word}
  img,svg,video{max-width:100%;height:auto}
  .wrap{width:100%;max-width:640px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e4e4e7;padding-bottom:14px;margin-bottom:18px}
  .badge{flex:0 0 auto;width:36px;height:36px;border-radius:8px;background:#002fa7;color:#fff;
    display:grid;place-items:center;font-weight:900;font-size:16px}
  h1{font-size:16px;margin:0;letter-spacing:-.01em;line-height:1.2;word-break:break-word}
  h1 small{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#52525b;margin-top:3px;font-weight:500}
  h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#52525b;
    margin:20px 0 8px;font-weight:600;border-top:1px solid #e4e4e7;padding-top:14px}
  label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#52525b;margin-bottom:5px;font-weight:600}
  input[type=text]{width:100%;max-width:100%;border:1px solid #e4e4e7;border-radius:6px;
    padding:9px 11px;font-size:14px;background:#fff;color:#09090b}
  input[type=text]:focus{outline:none;border-color:#002fa7;box-shadow:0 0 0 3px rgba(0,47,167,.15)}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:480px){.grid{grid-template-columns:1fr 1fr}}
  .dropzone{border:2px dashed #e4e4e7;border-radius:10px;padding:24px 12px;text-align:center;
    background:#fff;cursor:pointer;color:#52525b;word-break:break-word}
  .dropzone.drag{border-color:#002fa7;background:#fafafe;color:#09090b}
  .dropzone strong{display:block;color:#09090b;font-size:14px;margin-top:4px}
  .dropzone .hint{font-size:11px;margin-top:4px;color:#71717a}
  .meta{margin-top:10px;padding:9px 11px;border:1px solid #e4e4e7;border-radius:8px;background:#f4f4f5;
    font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;word-break:break-all}
  .meta b{font-weight:600;color:#09090b;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#52525b;white-space:nowrap}
  .controls{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  @media(min-width:480px){.controls{grid-template-columns:1fr 1fr}}
  .slider-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px;color:#52525b}
  input[type=range]{width:100%;margin:0;accent-color:#002fa7}
  input[type=color]{width:42px;height:34px;border:1px solid #e4e4e7;border-radius:6px;cursor:pointer;background:#fff;padding:2px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:#09090b}
  .switch input{appearance:none;-webkit-appearance:none;width:36px;height:21px;background:#d4d4d8;
    border-radius:999px;position:relative;transition:.15s;cursor:pointer;flex:0 0 auto}
  .switch input:checked{background:#002fa7}
  .switch input::after{content:"";position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;
    top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked::after{left:17px}
  button.primary{background:#002fa7;color:#fff;border:0;padding:12px 18px;border-radius:8px;
    font-weight:600;font-size:14px;cursor:pointer;width:100%}
  button.primary:active{background:#00227a}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid #e4e4e7;padding:12px 14px;border-radius:8px;
    font-weight:500;font-size:13px;cursor:pointer;color:#09090b}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .actions button.primary{flex:1 1 200px}
  .status{font-size:11.5px;color:#52525b;margin-top:10px;font-family:ui-monospace,monospace;word-break:break-word}
  .preset{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .preset button{flex:1 1 30%;min-width:80px;padding:8px 6px;border:1px solid #e4e4e7;background:#fff;
    border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:500;color:#09090b}
  .preset button:active{border-color:#002fa7;color:#002fa7}
  .stripe{height:5px;background:repeating-linear-gradient(-45deg,rgba(0,47,167,.2) 0 2px,transparent 2px 12px);
    margin-bottom:18px;border-radius:3px}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    border-top:1px solid #e4e4e7;padding-top:12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe"></div>
  <header>
    <div class="badge">R</div>
    <h1>RAMESHWAR SAHU EXAM APP<small>PDF Watermark · 5 Layers</small></h1>
  </header>

  <h2>01 · Upload PDF</h2>
  <div id="dropzone" class="dropzone">
    <div style="font-size:22px">📄</div>
    <strong>Tap to choose PDF</strong>
    <div class="hint">Auto-watermark fires on file select.</div>
    <input id="file" type="file" accept="application/pdf" hidden />
  </div>
  <div id="meta" class="meta" style="display:none"><b id="fname"></b><code id="fsize"></code></div>

  <h2>02 · Settings</h2>
  <div class="grid">
    <div><label>Watermark Text</label><input id="text" type="text" value="RAMESHWAR SAHU EXAM APP"/></div>
    <div><label>Footer Tag</label><input id="subText" type="text" placeholder="Candidate ID (optional)"/></div>
  </div>

  <div style="margin-top:14px"><label>Preset</label>
    <div class="preset">
      <button data-preset="light">Light</button>
      <button data-preset="medium">Standard</button>
      <button data-preset="heavy">Maximum</button>
    </div>
  </div>

  <div class="controls">
    <div><div class="slider-row"><label style="margin:0">Opacity</label><span id="opVal">22%</span></div>
      <input id="opacity" type="range" min="5" max="50" step="1" value="22"/></div>
    <div><div class="slider-row"><label style="margin:0">Density</label><span id="dnVal">1.10×</span></div>
      <input id="density" type="range" min="60" max="180" step="5" value="110"/></div>
  </div>

  <div class="opt">
    <div class="row"><label style="margin:0">Color</label><input id="color" type="color" value="#002FA7"/></div>
    <label class="switch">Auto-Download <input id="autoDl" type="checkbox" checked/></label>
  </div>

  <div class="actions">
    <button id="process" class="primary" disabled>⬇ Process &amp; Download</button>
    <button id="reset" class="ghost">Reset</button>
  </div>
  <div id="status" class="status">Awaiting PDF.</div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const fileInput=$("file"),dropzone=$("dropzone"),meta=$("meta"),fname=$("fname"),fsize=$("fsize");
  const textEl=$("text"),subEl=$("subText"),opEl=$("opacity"),opVal=$("opVal");
  const dnEl=$("density"),dnVal=$("dnVal"),colorEl=$("color"),autoDl=$("autoDl");
  const btn=$("process"),resetBtn=$("reset"),statusEl=$("status");
  let selected=null;
  const fmt=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";

  function setFile(f){
    if(!f) return;
    if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf"){statusEl.textContent="Only PDF supported.";return}
    selected=f; meta.style.display="flex";
    fname.textContent=f.name; fsize.textContent=fmt(f.size);
    btn.disabled=false; statusEl.textContent="Ready to stamp.";
    if(autoDl.checked) process();
  }
  dropzone.addEventListener("click",()=>fileInput.click());
  dropzone.addEventListener("dragover",e=>{e.preventDefault();dropzone.classList.add("drag")});
  dropzone.addEventListener("dragleave",()=>dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop",e=>{e.preventDefault();dropzone.classList.remove("drag");setFile(e.dataTransfer.files[0])});
  fileInput.addEventListener("change",e=>setFile(e.target.files[0]));
  opEl.addEventListener("input",()=>opVal.textContent=opEl.value+"%");
  dnEl.addEventListener("input",()=>dnVal.textContent=(dnEl.value/100).toFixed(2)+"×");
  document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
    const p=b.dataset.preset;
    if(p==="light"){opEl.value=12;dnEl.value=75}
    if(p==="medium"){opEl.value=22;dnEl.value=110}
    if(p==="heavy"){opEl.value=32;dnEl.value=160}
    opEl.dispatchEvent(new Event("input")); dnEl.dispatchEvent(new Event("input"));
  }));
  resetBtn.addEventListener("click",()=>{
    textEl.value="RAMESHWAR SAHU EXAM APP"; subEl.value="";
    opEl.value=22; dnEl.value=110; colorEl.value="#002FA7"; autoDl.checked=true;
    selected=null; fileInput.value=""; meta.style.display="none"; btn.disabled=true;
    opEl.dispatchEvent(new Event("input")); dnEl.dispatchEvent(new Event("input"));
    statusEl.textContent="Awaiting PDF.";
  });
  btn.addEventListener("click",process);

  function hexToRgb01(hex){
    const m=hex.replace("#",""),v=m.length===3?m.split("").map(x=>x+x).join(""):m;
    return{r:parseInt(v.slice(0,2),16)/255,g:parseInt(v.slice(2,4),16)/255,b:parseInt(v.slice(4,6),16)/255}
  }

  async function process(){
    if(!selected){statusEl.textContent="Select a PDF first.";return}
    const text=(textEl.value||"RAMESHWAR SAHU EXAM APP").trim();
    const subText=(subEl.value||"").trim();
    const opacity=Math.max(0.05,Math.min(0.5,parseInt(opEl.value,10)/100));
    const density=Math.max(0.6,Math.min(1.8,parseInt(dnEl.value,10)/100));
    const color=hexToRgb01(colorEl.value);
    btn.disabled=true; statusEl.textContent="Embedding 5 layers…";
    try{
      const {PDFDocument,StandardFonts,degrees,rgb}=PDFLib;
      const buf=await selected.arrayBuffer();
      const pdf=await PDFDocument.load(buf,{ignoreEncryption:true});
      const helvBold=await pdf.embedFont(StandardFonts.HelveticaBold);
      const helv=await pdf.embedFont(StandardFonts.Helvetica);
      const pages=pdf.getPages();
      const stamp=new Date().toISOString().slice(0,19).replace("T"," ");
      pages.forEach((page,idx)=>{
        const {width,height}=page.getSize();
        const stepX=Math.max(120,240/density), stepY=Math.max(90,150/density);
        const tile=Math.max(14,Math.min(width,height)*0.028);
        let row=0;
        for(let j=-stepY;j<height+stepY;j+=stepY,row++){
          const off=(row%2===0)?0:stepX/2;
          for(let i=-stepX+off;i<width+stepX;i+=stepX){
            page.drawText(text,{x:i,y:j,size:tile,font:helvBold,color:rgb(color.r,color.g,color.b),opacity,rotate:degrees(-30)});
          }
        }
        const co=Math.max(0.04,opacity*0.35);
        for(let j=-stepY;j<height+stepY;j+=stepY*1.4){
          for(let i=-stepX;i<width+stepX;i+=stepX*1.2){
            page.drawText(text,{x:i,y:j,size:tile*0.85,font:helv,color:rgb(color.r,color.g,color.b),opacity:co,rotate:degrees(30)});
          }
        }
        const cs=Math.min(width,height)*0.085;
        const cw=helvBold.widthOfTextAtSize(text,cs);
        page.drawText(text,{x:width/2-cw/2*0.7,y:height/2-cs*0.4,size:cs,font:helvBold,
          color:rgb(color.r,color.g,color.b),opacity:Math.max(0.08,opacity*0.55),rotate:degrees(-30)});
        const fs=Math.max(7,Math.min(width,height)*0.012);
        const footer=`${text}  •  Page ${idx+1}/${pages.length}  •  ${stamp}${subText?"  •  "+subText:""}`;
        page.drawText(footer,{x:14,y:10,size:fs,font:helv,color:rgb(color.r,color.g,color.b),opacity:0.55});
        page.drawText(text,{x:14,y:height-fs-8,size:fs,font:helvBold,color:rgb(color.r,color.g,color.b),opacity:0.55});
      });
      const bytes=await pdf.save({useObjectStreams:false});
      const outName=selected.name.replace(/\.pdf$/i,"")+"_watermarked.pdf";
      const blob=new Blob([bytes],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=outName;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
      statusEl.textContent="✓ Downloaded "+outName+" ("+fmt(bytes.length)+")";
    }catch(e){console.error(e); statusEl.textContent="✗ Failed: "+(e.message||e)}
    finally{btn.disabled=false}
  }
})();
</script>
</body>
</html>

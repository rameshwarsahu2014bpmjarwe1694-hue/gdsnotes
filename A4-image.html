<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #262626; padding: 40px; display: flex; justify-content: center; font-family: 'Arial', sans-serif; }
        
        #book-page { 
            width: 595px; min-height: 842px; 
            background: #f4efd3; /* Exact sample paper color */
            padding: 50px;
            /* 3D shadow and curved edge effect */
            box-shadow: 20px 20px 60px rgba(0,0,0,0.8), inset -15px 0 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .header { text-align: center; font-weight: bold; font-size: 14px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        .page-num { text-align: center; font-weight: bold; margin-bottom: 15px; }
        .chapter { text-align: center; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 20px; }
        
        /* Strict Formatting */
        .rule-title { font-weight: bold; text-decoration: underline; margin-top: 18px; display: block; }
        .q { font-weight: bold; margin-top: 12px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; margin-left: 20px; gap: 5px; margin-top: 5px; }
        .ans { font-weight: bold; margin-top: 5px; margin-bottom: 15px; }
        
        .controls { width: 400px; background: white; padding: 20px; border-radius: 8px; margin-right: 20px; height: fit-content; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Final Professional Generator</h3>
        <input type="text" id="pNum" placeholder="Page Number" style="width:90%"><br><br>
        <input type="text" id="chap" placeholder="Chapter Name" style="width:90%"><br><br>
        <textarea id="content" style="width:90%; height:200px;"></textarea>
        <button onclick="renderFinal()" style="width:100%; padding:10px; cursor:pointer;">Generate Perfect Image</button>
    </div>

    <div id="book-page">
        <div class="page-num" id="out-pNum">Page</div>
        <div class="header">'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'</div>
        <div class="chapter" id="out-chap">Chapter</div>
        <div id="display"></div>
    </div>

<script>
    function renderFinal() {
        document.getElementById('out-pNum').innerText = "Page " + document.getElementById('pNum').value;
        document.getElementById('out-chap').innerText = document.getElementById('chap').value;
        
        const lines = document.getElementById('content').value.split('\n');
        let html = "";
        
        lines.forEach(l => {
            let line = l.trim();
            if(line.startsWith("PO")) html += `<span class="rule-title">${line}</span>`;
            else if(line.startsWith("प्रश्न")) html += `<div class="q">${line}</div>`;
            else if(line.startsWith("(A)")) html += `<div class="options-grid"><div class="opt">${line}</div>`;
            else if(line.startsWith("(B)")) html += `<div class="opt">${line}</div></div>`;
            else if(line.startsWith("उत्तर")) html += `<div class="ans">${line}</div>`;
            else if(line !== "") html += `<div>${line}</div>`;
        });
        
        document.getElementById('display').innerHTML = html;

        // Canvas2/Nano High Precision Rendering
        html2canvas(document.getElementById('book-page'), {
            scale: 3, // High precision
            useCORS: true,
            backgroundColor: null
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Page_' + document.getElementById('pNum').value + '.png';
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f0f0; padding: 20px; }
        .controls { width: 650px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 3D Book Page Look Styling */
        #print-area { 
            width: 600px; 
            padding: 40px; 
            background: #fcfcfc; 
            border: 1px solid #dcdcdc; 
            margin: 40px auto; 
            /* 3D Shadow effect */
            box-shadow: 10px 10px 20px rgba(0,0,0,0.2), inset -5px 0 10px rgba(0,0,0,0.05); 
            border-radius: 2px;
            position: relative;
        }

        .header { text-align: center; font-weight: bold; font-size: 16px; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
        .page-num { text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .chapter { text-align: center; font-weight: bold; border-bottom: 1px solid #000; margin-bottom: 15px; padding-bottom: 5px; font-size: 15px; }
        
        .rule-title { font-weight: bold; text-decoration: underline; margin-top: 18px; display: block; color: #333; }
        .q { font-weight: bold; margin-top: 12px; }
        .opt { margin-left: 20px; display: inline-block; width: 45%; }
        .ans { font-weight: bold; margin-bottom: 12px; color: #222; }
        
        textarea { width: 100%; height: 250px; border: 1px solid #ccc; padding: 10px; }
        button { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Page Generator (Book Style)</h3>
        <input type="text" id="pNum" placeholder="Page Number (e.g. 15)" style="width:97%; padding:8px;"><br><br>
        <input type="text" id="chapName" style="width:97%; padding:8px;" placeholder="Chapter Name"><br><br>
        <textarea id="content" placeholder="Text yahan paste karein..."></textarea><br><br>
        <button onclick="renderPage()">Download as 3D Image</button>
    </div>

    <div id="print-area">
        <div class="page-num" id="display-pNum">Page</div>
        <div class="header">'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'</div>
        <div class="chapter" id="display-chap">Chapter Name</div>
        <div id="output"></div>
    </div>

<script>
    function renderPage() {
        document.getElementById('display-pNum').innerText = "Page " + document.getElementById('pNum').value;
        document.getElementById('display-chap').innerText = document.getElementById('chapName').value;
        
        const rawText = document.getElementById('content').value;
        const lines = rawText.split('\n');
        let html = "";
        
        lines.forEach(line => {
            let l = line.trim();
            if (l.startsWith("PO Manual")) html += `<span class="rule-title">${l}</span>`;
            else if (l.startsWith("प्रश्न")) html += `<div class="q">${l}</div>`;
            else if (l.startsWith("(A)") || l.startsWith("(B)") || l.startsWith("(C)") || l.startsWith("(D)")) html += `<div class="opt">${l}</div>`;
            else if (l.startsWith("उत्तर")) html += `<div class="ans">${l}</div>`;
            else if (l !== "") html += `<div>${l}</div>`;
        });
        
        document.getElementById('output').innerHTML = html;

        // Image Download with higher quality
        html2canvas(document.getElementById('print-area'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Study_Page_' + document.getElementById('pNum').value + '.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Georgia', serif; background: #e0e0e0; padding: 30px; display: flex; justify-content: center; }
        .controls { width: 450px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* 3D Book Page Style */
        #print-area { 
            width: 595px; /* A4 width */
            padding: 50px; 
            background: #fffdf5; /* Creamy paper color */
            border: 1px solid #ccc;
            margin-top: 20px;
            box-shadow: 15px 15px 30px rgba(0,0,0,0.3), inset -10px 0 20px rgba(0,0,0,0.05); 
            border-radius: 4px;
            color: #1a1a1a;
        }

        .header { text-align: center; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 5px; text-transform: uppercase; }
        .page-num { text-align: center; font-weight: bold; margin-bottom: 15px; }
        .chapter { text-align: center; font-weight: bold; border-bottom: 1px solid #000; margin-bottom: 20px; padding-bottom: 5px; }
        
        .rule-title { font-weight: bold; text-decoration: underline; margin-top: 20px; display: block; }
        .q { font-weight: bold; margin-top: 12px; line-height: 1.3; }
        .opt-container { display: flex; flex-wrap: wrap; margin-left: 20px; margin-top: 5px; }
        .opt { width: 48%; margin-bottom: 5px; }
        .ans { font-weight: bold; margin-bottom: 15px; margin-top: 5px; }
        
        textarea { width: 100%; height: 250px; border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
        button { background: #2c3e50; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Book Page Generator</h3>
        <input type="text" id="pNum" placeholder="Page Number" style="width:95%; padding:10px;"><br><br>
        <input type="text" id="chapName" style="width:95%; padding:10px;" placeholder="Chapter Name"><br><br>
        <textarea id="content" placeholder="Paste your bulk questions here..."></textarea>
        <button onclick="renderPage()">Generate High Quality Image</button>
    </div>

    <div id="print-area">
        <div class="page-num" id="display-pNum">Page</div>
        <div class="header">'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'</div>
        <div class="chapter" id="display-chap">Chapter Name</div>
        <div id="output"></div>
    </div>

<script>
    function renderPage() {
        document.getElementById('display-pNum').innerText = "Page " + document.getElementById('pNum').value;
        document.getElementById('display-chap').innerText = document.getElementById('chapName').value;
        
        const rawText = document.getElementById('content').value;
        const lines = rawText.split('\n');
        let html = "";
        
        lines.forEach(line => {
            let l = line.trim();
            if (l.startsWith("PO Manual")) html += `<span class="rule-title">${l}</span>`;
            else if (l.startsWith("प्रश्न")) html += `<div class="q">${l}</div>`;
            else if (l.startsWith("(A)") || l.startsWith("(B)") || l.startsWith("(C)") || l.startsWith("(D)")) html += `<div class="opt">${l}</div>`;
            else if (l.startsWith("उत्तर")) html += `<div class="ans">${l}</div>`;
            else if (l !== "") html += `<div>${l}</div>`;
        });
        
        document.getElementById('output').innerHTML = `<div class="opt-container">${html}</div>`;

        // High Quality Rendering
        html2canvas(document.getElementById('print-area'), { scale: 2, logging: false }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Page_' + document.getElementById('pNum').value + '.png';
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        });
    }
</script>
</body>
</html>

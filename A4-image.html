<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Essential: Background ko dark rakha taaki book highlight ho */
        body { background: #1a1a1a; display: flex; justify-content: center; padding: 50px; }
        
        #book-page { 
            width: 595px; min-height: 842px;
            /* Secret Paper Color and Gradient for Curve */
            background-color: #e8e2c8;
            background-image: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.02) 4%, rgba(0,0,0,0) 96%, rgba(0,0,0,0.2) 100%);
            
            /* The 3D Shadow Composition */
            box-shadow: 25px 25px 80px rgba(0,0,0,0.9), inset -20px 0 40px rgba(0,0,0,0.1);
            padding: 60px;
            position: relative;
        }

        /* Typography */
        .header { text-align: center; font-weight: 900; font-size: 16px; border-bottom: 3px double #000; padding-bottom: 8px; margin-bottom: 10px; text-transform: uppercase; }
        .rule-title { font-weight: 900; text-decoration: underline; margin-top: 25px; display: block; text-shadow: 0.5px 0 0 #000; }
        .q { font-weight: 900; margin-top: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-left: 20px; }
        .ans { font-weight: 900; margin-top: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="book-page">
        </div>
    
    <script>
        // High Precision Rendering Engine
        html2canvas(document.getElementById('book-page'), {
            scale: 4, // High DPI for crisp text
            useCORS: true,
            backgroundColor: null
        }).then(canvas => {
            // Save Image
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #444; padding: 30px; display: flex; justify-content: center; font-family: 'Arial', sans-serif; }
        .controls { width: 450px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin-right: 20px; }
        
        /* 3D BOOK PAGE STYLE */
        #book-page { 
            width: 595px; min-height: 842px; /* A4 size */
            padding: 50px 60px; 
            background: #fdfaf0; /* Cream paper */
            border: 1px solid #dcdcdc;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.6), inset -10px 0 30px rgba(0,0,0,0.05); 
            position: relative;
        }

        .header { text-align: center; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 5px; text-transform: uppercase; }
        .page-num { text-align: center; font-weight: bold; margin-bottom: 10px; }
        .chapter { text-align: center; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 20px; }
        
        .rule-title { font-weight: bold; text-decoration: underline; margin-top: 20px; display: block; }
        .q { font-weight: bold; margin-top: 15px; margin-bottom: 5px; }
        .opt-row { display: flex; flex-wrap: wrap; margin-left: 20px; margin-bottom: 5px; }
        .opt { width: 48%; }
        .ans { font-weight: bold; margin-bottom: 20px; } /* Space after each Q */
        
        textarea { width: 100%; height: 200px; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Page Generator</h3>
        <input type="text" id="pNum" placeholder="Page Number" style="width:90%; padding:8px;"><br><br>
        <input type="text" id="chapName" style="width:90%; padding:8px;" placeholder="Chapter Name"><br><br>
        <textarea id="content" placeholder="Q:...&#10;(A)... (B)...&#10;उत्तर:..."></textarea>
        <button onclick="renderPage()" style="padding:10px; width:100%; cursor:pointer;">Generate 3D Book Image</button>
    </div>

    <div id="book-page">
        <div class="page-num" id="display-pNum">Page</div>
        <div class="header">'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'</div>
        <div class="chapter" id="display-chap">Chapter Name</div>
        <div id="output"></div>
    </div>

<script>
    function renderPage() {
        document.getElementById('display-pNum').innerText = "Page " + document.getElementById('pNum').value;
        document.getElementById('display-chap').innerText = document.getElementById('chapName').value;
        
        const rawText = document.getElementById('content').value;
        const lines = rawText.split('\n');
        let html = "";
        
        lines.forEach(line => {
            let l = line.trim();
            if (l.startsWith("PO Manual")) html += `<span class="rule-title">${l}</span>`;
            else if (l.startsWith("प्रश्न")) html += `<div class="q">${l}</div>`;
            else if (l.startsWith("(A)") || l.startsWith("(B)") || l.startsWith("(C)") || l.startsWith("(D)")) html += `<div class="opt">${l}</div>`;
            else if (l.startsWith("उत्तर")) html += `<div class="ans">${l}</div>`;
            else if (l !== "") html += `<div>${l}</div>`;
        });
        
        document.getElementById('output').innerHTML = `<div class="opt-row">${html}</div>`;

        // High-Quality Export
        html2canvas(document.getElementById('book-page'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Study_Page_' + document.getElementById('pNum').value + '.png';
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        });
    }
</script>
</body>
</html>

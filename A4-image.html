<!DOCTYPE html>
<html lang="hi">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f0f0; padding: 20px; }
        .controls { width: 650px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 3D Book Page Look Styling */
        .book-page{
    width:950px;
    margin:20px auto;
    padding:20px 25px;

    background:#f7f0e4;

    background-image:
    radial-gradient(rgba(0,0,0,.03) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.02) 1px, transparent 1px);

    background-size:12px 12px,18px 18px;

    border:4px solid #111;

    position:relative;

    box-shadow:
    0 10px 25px rgba(0,0,0,.25),
    inset 0 0 40px rgba(0,0,0,.05);
}

/* Right Side Pink Book Binding */
.book-page::after{
    content:"";

    position:absolute;
    top:15px;
    right:-22px;

    width:28px;
    height:calc(100% - 30px);

    background:
    linear-gradient(
    to right,
    #d7a6bf,
    #f3d3e0,
    #d7a6bf
    );

    border-radius:0 12px 12px 0;

    box-shadow:
    inset 0 0 10px rgba(255,255,255,.7),
    3px 0 10px rgba(0,0,0,.25);
}

/* Paper Aging Effect */
.book-page::before{
    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at 20% 30%, rgba(120,90,40,.06), transparent 120px),
    radial-gradient(circle at 70% 60%, rgba(120,90,40,.05), transparent 150px),
    radial-gradient(circle at 40% 80%, rgba(120,90,40,.04), transparent 130px);

    pointer-events:none;
}
        .page-num{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.header{
    text-align:center;
    font-size:20px;
    font-weight:700;

    border-bottom:5px solid #000;

    padding-bottom:6px;
    margin-bottom:10px;
}

.chapter{
    text-align:center;
    font-size:22px;
    font-weight:700;

    border-bottom:2px solid #000;

    padding-bottom:5px;
    margin-bottom:20px;
}

.q{
    font-weight:700;
    font-size:22px;
    margin-top:18px;
}

.opt{
    display:inline-block;
    width:48%;
    font-size:20px;
    vertical-align:top;
}

.ans{
    font-size:20px;
    font-weight:bold;
    margin:8px 0 18px 0;
}
        
        textarea { width: 100%; height: 250px; border: 1px solid #ccc; padding: 10px; }
        button { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Page Generator (Book Style)</h3>
        <input type="text" id="pNum" placeholder="Page Number (e.g. 15)" style="width:97%; padding:8px;"><br><br>
        <input type="text" id="chapName" style="width:97%; padding:8px;" placeholder="Chapter Name"><br><br>
        <textarea id="content" placeholder="Text yahan paste karein..."></textarea><br><br>
        <button onclick="renderPage()">Download as 3D Image</button>
    </div>

    <div id="print-area" class="book-page">
        <div class="page-num" id="display-pNum">Page</div>
        <div class="header">'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'</div>
        <div class="chapter" id="display-chap">Chapter Name</div>
        <div id="output"></div>
    </div>

<script>
    function renderPage() {
        document.getElementById('display-pNum').innerText = "Page " + document.getElementById('pNum').value;
        document.getElementById('display-chap').innerText = document.getElementById('chapName').value;
        
        const rawText = document.getElementById('content').value;
        const lines = rawText.split('\n');
        let html = "";
        
        lines.forEach(line => {
            let l = line.trim();
            if (l.startsWith("PO Manual")) html += `<span class="rule-title">${l}</span>`;
            else if (l.startsWith("प्रश्न")) html += `<div class="q">${l}</div>`;
            else if (l.startsWith("(A)") || l.startsWith("(B)") || l.startsWith("(C)") || l.startsWith("(D)")) html += `<div class="opt">${l}</div>`;
            else if (l.startsWith("उत्तर")) html += `<div class="ans">${l}</div>`;
            else if (l !== "") html += `<div>${l}</div>`;
        });
        
        document.getElementById('output').innerHTML = html;

        // High Quality Image Download
html2canvas(document.getElementById('print-area'), {
    scale: 4,           // 2 की जगह 4
    useCORS: true,
    backgroundColor: null,
    logging: false,
    allowTaint: true,
    imageTimeout: 0
}).then(canvas => {

    const link = document.createElement('a');

    link.download =
        'Study_Page_' +
        document.getElementById('pNum').value +
        '.png';

    link.href = canvas.toDataURL(
        'image/png',
        1.0
    );

    link.click();
});
</script>
</body>
</html>

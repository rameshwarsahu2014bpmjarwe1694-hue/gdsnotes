<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#222;
font-family:Arial, sans-serif;
display:flex;
gap:20px;
padding:20px;
}

.controls{
width:350px;
background:#fff;
padding:20px;
border-radius:10px;
height:fit-content;
}

.controls h2{
margin-bottom:15px;
}

.controls input,
.controls textarea{
width:100%;
padding:10px;
margin-bottom:10px;
}

.controls button{
width:100%;
padding:15px;
font-weight:bold;
cursor:pointer;
background:#000;
color:#fff;
border:none;
}

.preview-wrap{
display:flex;
flex-direction:column;
align-items:center;
}

.page-top{
color:#fff;
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

#book-page{
width:950px;
background:#f6f0dc;

background-image:
linear-gradient(
to right,
rgba(0,0,0,.10) 0%,
rgba(0,0,0,.03) 5%,
rgba(255,255,255,.10) 50%,
rgba(0,0,0,.03) 95%,
rgba(0,0,0,.10) 100%
);

padding:18px 35px;

border:4px solid #000;

box-shadow:
0 0 60px rgba(0,0,0,.7),
inset 0 0 25px rgba(0,0,0,.08);

position:relative;
}

.maroon-line{
height:4px;
background:#5a1c1c;
margin:5px 0;
}

.header{
text-align:center;
font-size:22px;
font-weight:900;
}

.chapter{
text-align:center;
font-size:22px;
font-weight:900;
padding-bottom:8px;
border-bottom:3px solid #000;
margin-bottom:12px;
}

.big-heading{
font-size:24px;
font-weight:900;
text-decoration:underline;
line-height:1.2;
margin-bottom:8px;
}

.rule-title{
font-size:20px;
font-weight:900;
text-decoration:underline;
margin-top:18px;
margin-bottom:6px;
}

.q{
font-size:19px;
font-weight:900;
line-height:1.3;
margin-top:8px;
}

.option{
font-size:19px;
font-weight:900;
line-height:1.25;
margin-left:25px;
}

.normal{
font-size:19px;
font-weight:900;
line-height:1.3;
}

.ans{
font-size:20px;
font-weight:900;
margin-top:5px;
margin-bottom:10px;
}

.footer-page{
text-align:center;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

</style>
</head>

<body>

<div class="controls">

<h2>Page Generator</h2>

<input id="pNum" placeholder="Page Number">

<input id="chap" placeholder="Chapter Name">

<textarea id="content" rows="18"
placeholder="Content Paste Here"></textarea>

<button onclick="downloadPage()">
Generate PNG
</button>

</div>

<div class="preview-wrap">

<div class="page-top" id="topPage">
Page 1
</div>

<div id="book-page">

<div class="maroon-line"></div>

<div class="header">
'RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB'
</div>

<div class="maroon-line"></div>

<div class="chapter" id="out-chap">
POSTAL MANUAL VOLUME 5
</div>

<div id="display"></div>

<div class="footer-page" id="footerPage">
Page 1
</div>

</div>

</div>

<script>

function buildPage(){

let page=document.getElementById("pNum").value || "1";

document.getElementById("topPage").innerText=
"Page "+page;

document.getElementById("footerPage").innerText=
"Page "+page;

document.getElementById("out-chap").innerText=
document.getElementById("chap").value;

let lines=
document.getElementById("content")
.value
.split("\n");

let html="";

lines.forEach(line=>{

line=line.trim();

if(line==="") return;

if(
line.startsWith("PO") ||
line.startsWith("पो") ||
line.startsWith("Postal")
){
html+=`
<div class="rule-title">
${line}
</div>`;
}

else if(line.startsWith("प्रश्न"))
{
html+=`
<div class="q">
${line}
</div>`;
}

else if(
line.startsWith("(A)")||
line.startsWith("(B)")||
line.startsWith("(C)")||
line.startsWith("(D)")||
line.startsWith("(E)")
)
{
html+=`
<div class="option">
${line}
</div>`;
}

else if(line.startsWith("उत्तर"))
{
html+=`
<div class="ans">
${line}
</div>`;
}

else
{
html+=`
<div class="normal">
${line}
</div>`;
}

});

document.getElementById("display").innerHTML=html;

}

function downloadPage(){

buildPage();

html2canvas(
document.getElementById("book-page"),
{
scale:4,
backgroundColor:null
}
).then(canvas=>{

let link=document.createElement("a");

link.download=
"Page_"+document.getElementById("pNum").value+".png";

link.href=
canvas.toDataURL("image/png");

link.click();

});

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mock Test - GDS EXAM</title>
    <style>
        .hide { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .subject-card, .section-sub-card { padding: 15px; border: 2px solid #ddd; border-radius: 10px; text-align: center; cursor: pointer; background: #fff; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <button onclick="goBack()">⬅ Back</button>
    
    <div id="subjectBox">
        <div class="grid">
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 7')">VOL 7</div>
            <div class="subject-card" onclick="showSections('GK')">GK</div>
            <div class="subject-card" onclick="showSections('Maths')">Maths</div>
            <div class="subject-card" onclick="showSections('Reasoning')">Reasoning</div>
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 5')">VOL 5</div>
            <div class="subject-card" onclick="showSections('Post Office Guide 1')">PO GUIDE 1</div>
            <div class="subject-card" onclick="showSections('Post Office Guide 2')">PO GUIDE 2</div>
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 6 PART 3')">VOL 6 PART 3</div>
        </div>
    </div>

    <div id="sectionBox" class="hide">
        <h3 id="selectedSubjectTitle"></h3>
        <div class="grid">
            <div class="section-sub-card" onclick="selectSection('Section I')">Section I</div>
            <div class="section-sub-card" onclick="selectSection('Section II')">Section II</div>
            <div class="section-sub-card" onclick="selectSection('Section III')">Section III</div>
            <div class="section-sub-card" onclick="selectSection('Section IV')">Section IV</div>
            <div class="section-sub-card" onclick="selectSection('Section V')">Section V</div>
        </div>
        <button onclick="backToSubjects()">← Back to Subjects</button>
    </div>

    <div id="quizBox" class="hide"><h2>Quiz Started</h2></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ",
        projectId: "gds-departmental-exam-studyhub",
        // ... बाकी कॉन्फ़िगरेशन वही है जो आपके पास है
    }));

    let subject = "", selectedSection = "";

    window.showSections = (sub) => {
        subject = sub;
        document.getElementById("selectedSubjectTitle").innerText = sub;
        document.getElementById("subjectBox").classList.add("hide");
        document.getElementById("sectionBox").classList.remove("hide");
    };

    window.backToSubjects = () => {
        document.getElementById("sectionBox").classList.add("hide");
        document.getElementById("subjectBox").classList.remove("hide");
    };

    window.selectSection = (sec) => {
        selectedSection = sec;
        startQuiz(subject);
    };

    window.goBack = () => {
        if (!document.getElementById("sectionBox").classList.contains("hide")) {
            backToSubjects();
        } else if (!document.getElementById("quizBox").classList.contains("hide")) {
            location.reload();
        } else {
            window.history.back();
        }
    };

    window.startQuiz = async (sub) => {
        const qy = query(collection(db, "quizQuestions"), where("subject", "==", sub));
        const snap = await getDocs(qy);
        let questions = [];
        snap.forEach(doc => {
            let data = doc.data();
            // यहाँ पुराना logic है जो पुराने बिना सेक्शन वाले सवालों को Section I में डालता है
            if ((data.section || "Section I") === selectedSection) questions.push(data);
        });

        if (questions.length === 0) {
            alert("इस सेक्शन में कोई सवाल नहीं हैं।");
        } else {
            document.getElementById("sectionBox").classList.add("hide");
            document.getElementById("quizBox").classList.remove("hide");
            // आगे का रेंडरिंग लॉजिक आपका वही रहेगा
        }
    };
</script>
</body>
</html>

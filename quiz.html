<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mock Test - RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --warning: #ff9800; --dark: #2c3e50; --danger: #dc3545; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--dark); margin-bottom: 20px; font-size: 22px; border-bottom: 3px solid var(--primary); padding-bottom: 10px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: var(--dark); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .timer-box { background: var(--danger); color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .subject-card { background: #fafafa; border: 2px solid #ddd; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; display: flex; align-items: center; justify-content: center; min-height: 80px; }
        .subject-card:hover { border-color: var(--primary); background: #eef7ff; transform: translateY(-2px); }
        .card { background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .question-text { font-weight: bold; font-size: 16px; margin: 15px 0; color: var(--dark); }
        .option { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 15px; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 13px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #fff; flex: 1; font-size: 15px; }
        .hide { display: none; }
        .section-sub-card { background: #f8f9fa; border: 1px dashed #ccc; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 14px; color: var(--dark); cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <button class="btn-back" onclick="goBack()">⬅ Back</button>
        <div class="timer-box" id="timer">30:00</div>
    </div>
    <h1>Mock Test Hub</h1>
    <div id="subjectBox">
        <div class="grid">
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 7')">📘 VOL 7</div>
            <div class="subject-card" onclick="showSections('GK')">🌍 GK</div>
            <div class="subject-card" onclick="showSections('Maths')">➕ Maths</div>
            <div class="subject-card" onclick="showSections('Reasoning')">🧠 Reasoning</div>
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 5')">📘 VOL 5</div>
            <div class="subject-card" onclick="showSections('Post Office Guide 1')">📮 PO GUIDE 1</div>
            <div class="subject-card" onclick="showSections('Post Office Guide 2')">📮 PO GUIDE 2</div>
            <div class="subject-card" onclick="showSections('POSTAL MANUAL VOLUME 6 PART 3')">📘 VOL 6 PART 3</div>
        </div>
    </div>
    <div id="sectionBox" class="hide card">
        <h3 id="selectedSubjectTitle" style="text-align:center;"></h3>
        <div class="grid">
            <div class="section-sub-card" onclick="selectSection('Section I')">Section I</div>
            <div class="section-sub-card" onclick="selectSection('Section II')">Section II</div>
        </div>
        <button class="btn" style="background:#6c757d; width:100%; margin-top:10px;" onclick="backToSubjects()">← Back</button>
    </div>
    <div id="quizBox" class="hide"><div class="card"><div id="progress"></div><div class="question-text" id="question"></div><div id="options"></div><div class="btn-row"><button class="btn" style="background:#6c757d" onclick="prevQ()">Prev</button><button class="btn" style="background:#2c3e50" onclick="nextQ()">Next</button><button class="btn" style="background:#28a745" onclick="submitQuiz()">Submit</button></div></div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const db = getFirestore(initializeApp({ apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ", projectId: "gds-departmental-exam-studyhub" }));

    let subject = "", selectedSection = "", questions = [], current = 0, answers = {}, submitted = false;

    window.showSections = (sub) => { subject = sub; document.getElementById("selectedSubjectTitle").innerText = sub; document.getElementById("subjectBox").classList.add("hide"); document.getElementById("sectionBox").classList.remove("hide"); };
    window.backToSubjects = () => { document.getElementById("sectionBox").classList.add("hide"); document.getElementById("subjectBox").classList.remove("hide"); };
    window.selectSection = (sec) => { selectedSection = sec; startQuiz(subject); };
    window.goBack = () => { if (!document.getElementById("subjectBox").classList.contains("hide")) return; location.reload(); };

    window.startQuiz = async (sub) => {
        const qy = query(collection(db, "quizQuestions"), where("subject", "==", sub));
        const snap = await getDocs(qy);
        questions = [];
        snap.forEach(doc => { let d = doc.data(); if ((d.section || "Section I") === selectedSection) questions.push(d); });
        if(questions.length > 0) { document.getElementById("sectionBox").classList.add("hide"); document.getElementById("quizBox").classList.remove("hide"); render(); }
        else alert("कोई सवाल नहीं मिले।");
    };

    window.render = () => { let q = questions[current]; document.getElementById("progress").innerText = `प्रश्न: ${current + 1} / ${questions.length}`; document.getElementById("question").innerText = q.question; let html = ""; q.options.forEach(op => html += `<div class="option" onclick="saveAns('${op}')"><input type="radio"> ${op}</div>`); document.getElementById("options").innerHTML = html; };
    window.saveAns = (v) => { answers[current] = v; };
    window.nextQ = () => { if(current < questions.length - 1) { current++; render(); } };
    window.prevQ = () => { if(current > 0) { current--; render(); } };
    window.submitQuiz = () => { alert("टेस्ट सबमिट हो गया!"); location.reload(); };
</script>
</body>
</html>

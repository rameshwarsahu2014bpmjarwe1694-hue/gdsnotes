<body>

<h2>💰 Admin Payment Dashboard</h2>
<div id="list">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
updateDoc,
setDoc,
doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  databaseURL: "https://gds-departmental-exam-studyhub-default-rtdb.asia-southeast1.firebasedatabase.app",

  storageBucket: "gds-departmental-exam-studyhub.firebasestorage.app",
  messagingSenderId: "759916756080",
  appId: "1:759916756080:web:7f2c0e66458bd007e888b5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "rameshwarsahu2014bpmjarwe1694@gmail.com";

/* 🔥 ADMIN CHECK */
onAuthStateChanged(auth, (user)=>{
if(!user || user.email !== ADMIN_EMAIL){
document.body.innerHTML = "<h2>❌ Access Denied</h2>";
return;
}
loadData();
});

/* 🔥 LOAD PAYMENTS */
async function loadData() {
    const box = document.getElementById("list");
    box.innerHTML = "Loading...";

    const usersSnap = await getDocs(collection(db, "payments"));
    box.innerHTML = "";

    for (const user of usersSnap.docs) {
        const txSnap = await getDocs(collection(db, "payments", user.id, "transactions"));

        txSnap.forEach(d => {
            const t = d.data();
            box.innerHTML += `
            <div class="card">
                <div><b>User:</b> ${user.id}</div>
                <div><b>Txn ID:</b> ${t.transactionId || "-"}</div>
                <div><b>Request:</b> ${t.requested_for || "-"}</div>
                <div><b>Status:</b> ${t.status || "pending"}</div>
                <small>${t.submittedAt ? "Submitted" : ""}</small>
                <br>
                <button class="btn approve" onclick="approve('${user.id}','${d.id}')">Approve</button>
                <button class="btn reject" onclick="reject('${user.id}','${d.id}')">Reject</button>
            </div>
            `;
        });
    }
}

/* 🔥 APPROVE - Updated to update Root Document too */
window.approve = async (email, tid) => {
    try {

        await updateDoc(
            doc(db, "payments", email, "transactions", tid),
            {
                status: "completed"
            }
        );

        await setDoc(
            doc(db, "payments", email),
            {
                status: "completed",
                approvedAt: serverTimestamp()
            },
            { merge: true }
        );

        alert("Approved ✔");
        loadData();

    } catch (e) {
        alert("Error: " + e.message);
    }
};

/* 🔥 REJECT */

    try {
        await updateDoc(doc(db, "payments", email, "transactions", tid), {
            window.reject = async (email, tid) => {
    try {

        await updateDoc(
            doc(db, "payments", email, "transactions", tid),
            {
                status: "rejected"
            }
        );

        await setDoc(
            doc(db, "payments", email),
            {
                status: "pending"
            },
            { merge: true }
        );

        alert("Rejected ❌");
        loadData();

    } catch (e) {
        alert("Error: " + e.message);
    }
};

</script>

</body>

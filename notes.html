<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Notes</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
        body{ background:#f4f6f9; padding:15px; }
        .container{ max-width:1000px; margin:auto; }
        .topbar{ background:#b30000; color:#fff; padding:16px; text-align:center; font-size:24px; font-weight:700; border-radius:14px; margin-bottom:16px; }
        .tools{ display:grid; grid-template-columns: 1.5fr 1fr 1fr; gap:12px; margin-bottom:16px; }
        input,select{ width:100%; padding:13px; border:1px solid #ccc; border-radius:12px; font-size:15px; outline:none; background:#fff; }
        #notesList{ display:grid; gap:14px; }
        .note{ background:#fff; padding:18px; border-radius:16px; box-shadow:0 5px 14px rgba(0,0,0,.08); }
        .note h3{ font-size:20px; margin-bottom:8px; color:#111; }
        .meta{ font-size:14px; color:#666; margin-bottom:10px; display: flex; gap: 10px; }
        .tag{ background: #eee; padding: 4px 8px; border-radius: 6px; }
        .desc{ line-height:1.6; white-space:pre-wrap; color:#222; margin-top:8px; }
        .preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-top: 10px; background: #f9f9f9; }
        .empty{ background:#fff; padding:18px; border-radius:14px; text-align:center; color:#666; }
        .back-btn { display: inline-block; padding: 10px 15px; background: #444; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
        @media(max-width:700px){ .tools{ grid-template-columns:1fr; } }
    </style>
</head>
<body>

<div id="qrBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; padding:25px; border-radius:15px; text-align:center; max-width:400px; width:100%;">
        <h3>Payment Required</h3>
        <h4 id="amountDisplay" style="margin: 10px 0;">Amount: ₹29</h4>
        <img id="qrImage" src="" style="width:200px; height:200px; margin: 10px auto; display: block;" />
        <div style="background:#f0f0f0; padding:10px; border-radius:5px; margin:10px 0; font-weight:bold;">
            <span id="upiDisplay">6268782886@ybl</span>
            <button onclick="navigator.clipboard.writeText('6268782886@ybl'); alert('Copied!');" style="margin-left:10px; cursor:pointer;">Copy</button>
        </div>
        <div style="margin-top:15px; border-top:1px solid #ddd; padding-top:10px; text-align:left;">
            <p style="font-size:13px; margin-bottom:5px;">Payment Karne Ke Baad Details bhejein:</p>
            <input type="text" id="txnIdInput" placeholder="Enter Transaction ID" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:4px;">
            <input type="file" id="screenshotInput" accept="image/*" style="width:100%; margin-bottom:8px;">
            <button onclick="submitPaymentProof()" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Submit Proof</button>
        </div>
        <button onclick="closeQR()" style="margin-top:15px; background:red; color:white; border:none; padding:8px 20px; border-radius:5px;">Close</button>
    </div>
</div>

<div class="container">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back</button>
    <div class="topbar">📚 Notes</div>
    <div class="tools">
        <input type="text" id="searchInput" placeholder="Search notes...">
        <select id="postFilter"><option value="ALL">All Posts</option><option value="MTS">MTS</option><option value="POSTMAN">POSTMAN</option><option value="PA/SA">PA/SA</option></select>
        <select id="subFilter"><option value="ALL">All Subjects</option><option value="GK">GK</option><option value="Maths">Maths</option><option value="Reasoning">Reasoning</option><option value="PO GUIDE 1">PO Guide 1</option><option value="PO GUIDE 2">PO Guide 2</option><option value="POSTAL MANUAL 5">Postal Manual Vol 5</option><option value="POSTAL MANUAL 6">Postal Manual Vol 6 Part 3</option><option value="POSTAL MANUAL 7">Postal Manual Vol 7</option></select>
    </div>
    <div id="notesList"><div class="empty">Loading...</div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        // यहाँ अपना Firebase Config वापस डालें
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    window.BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
    window.allNotes = [];

    onAuthStateChanged(auth, (user) => {
        if (user) { window.currentUserEmail = user.email; loadNotes(); }
        else { window.location.href = "login.html"; }
    });

    async function loadNotes(){
        const snap = await getDocs(query(collection(db, "notes"), orderBy("createdAt", "desc")));
        window.allNotes = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderNotes(window.allNotes);
    }

    window.renderNotes = function(arr){
        const box = document.getElementById("notesList");
        if(arr.length === 0){ box.innerHTML = `<div class="empty">No notes found</div>`; return; }
        box.innerHTML = arr.map(x => `
        <div class="note">
            <h3>${safe(x.title)}</h3>
            <div class="meta">
                <span class="tag">📮 ${safe(x.category || "-")}</span>
                <span class="tag">📖 ${safe(x.subject || "-")}</span>
            </div>
            ${x.imageURL ? `<img src="${x.imageURL}" class="preview">` : ""}
            ${x.description ? `<div class="desc">${safe(x.description)}</div>` : ""}
            <button onclick="handleSecureAccess('${x.category?.replace(/'/g, "\\'")}', '${x.subject?.replace(/'/g, "\\'")}', ${Number(x.price || 29)})"
                style="width:100%; margin-top:15px; background:#355da9; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">
                Pay & Open (₹${x.price || 29})
            </button>
        </div>`).join('');
    };

    window.handleSecureAccess = async (cat, sub, price) => {
        const token = await auth.currentUser.getIdToken();
        const res = await fetch(`${BACKEND_URL}/get-pdf?post=${cat}&subject=${sub}`, {
            headers: { 'X-Source-Auth': 'RSH-GDS-SECURE-ACCESS', 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 200) {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${sub}.pdf`; a.click();
        } else if (res.status === 403) {
            document.getElementById("amountDisplay").innerText = `Amount: ₹${price}`;
            document.getElementById("qrBox").style.display = "flex";
        }
    };

    window.submitPaymentProof = async () => {
        const formData = new FormData();
        formData.append("txnId", document.getElementById("txnIdInput").value);
        formData.append("email", window.currentUserEmail);
        if(document.getElementById("screenshotInput").files) formData.append("screenshot", document.getElementById("screenshotInput").files);
        
        const res = await fetch(`${BACKEND_URL}/submit-proof`, {
            method: "POST", body: formData,
            headers: { "Authorization": `Bearer ${await auth.currentUser.getIdToken()}`, "X-Source-Auth": "RSH-GDS-SECURE-ACCESS" }
        });
        if (res.ok) { alert("Proof submitted!"); closeQR(); }
    };

    window.closeQR = () => document.getElementById("qrBox").style.display = "none";
    window.safe = (v) => String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

    document.getElementById("searchInput").addEventListener("input", applyFilter);
    document.getElementById("postFilter").addEventListener("change", applyFilter);
    document.getElementById("subFilter").addEventListener("change", applyFilter);

    function applyFilter(){
        const q = document.getElementById("searchInput").value.toLowerCase();
        const post = document.getElementById("postFilter").value;
        const sub = document.getElementById("subFilter").value;
        renderNotes(window.allNotes.filter(x => 
            x.title.toLowerCase().includes(q) && 
            (post === "ALL" || x.category === post) && 
            (sub === "ALL" || x.subject === sub)
        ));
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart OCR PDF (Sorted)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
    /* Pure page ka background color set karne ke liye */
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 30px; 
        /* Yahan se background badlega (Dark Blue Gradient) */
        background: linear-gradient(135deg, #2c3e50, #000000); 
        color: #ffffff; /* Text color white kar diya taaki dark background pe dikhe */
        min-height: 100vh;
        margin: 0;
    }
    
    /* Brand Name Design */
    .brand-title {
        color: #f1c40f; /* Golden color for brand */
        text-align: center;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        border-bottom: 3px solid #f1c40f;
        padding-bottom: 10px;
        margin-bottom: 30px;
    }

    progress { width: 100%; height: 25px; border-radius: 10px; overflow: hidden; background: #eee; }

    /* 3D Colorful Buttons */
    button {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background: linear-gradient(to bottom, #e67e22, #d35400); /* Orange 3D */
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 6px #a04000; /* Darker shade for 3D effect */
        transition: all 0.2s;
    }
    button:active {
        box-shadow: 0 2px #a04000;
        transform: translateY(4px);
    }

    /* File input ko center karne ke liye */
    #files { display: block; margin: 20px auto; }
</style>
    
</head>

<body>

<h2>Smart Image → Sorted PDF (OCR)</h2>
    
<h3 class="brand-title">RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB</h3>

<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">Waiting...</p>

<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>

let progress = 0;

/* ---------------- PROGRESS ---------------- */
function updateProgress(msg, value) {
    document.getElementById("progressBar").value = value;
    document.getElementById("progressText").innerText = `${msg} ${Math.round(value)}%`;
}

/* ---------------- BASE64 ---------------- */
function toBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

/* ---------------- IMAGE CLEAN ---------------- */
function prepareCanvasFromImage(img) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < data.data.length; i += 4) {
        let avg = (data.data[i] + data.data[i+1] + data.data[i+2]) / 3;
        avg = avg > 150 ? 255 : 0;

        data.data[i] = data.data[i+1] = data.data[i+2] = avg;
    }

    ctx.putImageData(data, 0, 0);

    return canvas;
}

/* ---------------- TARGETED OCR (Only Page Number Focus) ---------------- */
async function readPageNumber(img) {
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);

    // Scan area: Top 20% aur Bottom 20% center
    const w = canvas.width;
    const h = canvas.height;
    const areas = [
        { x: w * 0.3, y: 0, w: w * 0.4, h: h * 0.25 },     // Top Center
        { x: w * 0.3, y: h * 0.75, w: w * 0.4, h: h * 0.25 } // Bottom Center
    ];

    let pageNumbers = [];

    for (const area of areas) {
        const areaCanvas = document.createElement("canvas");
        areaCanvas.width = area.w;
        areaCanvas.height = area.h;
        areaCanvas.getContext("2d").drawImage(canvas, area.x, area.y, area.w, area.h, 0, 0, area.w, area.h);
        
        // Tesseract sirf "Page" aur numbers par focus karega
        const res = await Tesseract.recognize(areaCanvas, "eng", {
            tessedit_char_whitelist: '0123456789page'
        });
        
        const text = res.data.text.toLowerCase();
        // Sirf "page X" pattern dhoondho
        const regex = /page\s*(\d+)/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
            pageNumbers.push(Number(match));
        }
    }

    return pageNumbers.length > 0 ? Math.min(...pageNumbers) : 999999;
}

/* ---------------- PDF (Original Quality, No Crop) ---------------- */
async function makePDF(images) {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");

    for (let i = 0; i < images.length; i++) {
        if (i > 0) pdf.addPage();
        // Original Quality Maintain Rakhi Hai
        pdf.addImage(images[i].data, "JPEG", 0, 0, 210, 297); 
    }
    pdf.save("Sorted_Pages.pdf");
}


/* ---------------- PROCESS FAST VERSION ---------------- */
async function process(files) {
    const arr = [];
    const fileList = Array.from(files);
    let done = 0;

    // Concurrency limit: Ek baar mein sirf 3 images process karein (Taaki browser hang na ho)
    const limit = 3; 
    
    for (let i = 0; i < fileList.length; i += limit) {
        const batch = fileList.slice(i, i + limit);
        
        // Batch ki saari images parallel process karein
        const batchPromises = batch.map(async (file) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.src = url;
            await new Promise(r => img.onload = r);

            const page = await readPageNumber(img);
            const base64 = await toBase64(file);
            URL.revokeObjectURL(url);
            
            return { page, data: base64, originalName: file.name };
        });

        const results = await Promise.all(batchPromises);
        arr.push(...results);
        
        done += results.length;
        updateProgress("Processing", (done / fileList.length) * 100);
    }

    // SORTING & DEDUPLICATION
    const uniqueMap = new Map();
    arr.sort((a, b) => a.page - b.page).forEach(item => {
        if (!uniqueMap.has(item.page)) uniqueMap.set(item.page, item);
    });

    await makePDF(Array.from(uniqueMap.values()));
    alert("PDF " + uniqueMap.size + " pages ke saath ban gayi!");
}



/* ---------------- START ---------------- */
function startProcess() {

    const files = document.getElementById("files").files;

    if (!files.length) {
        alert("Select images first");
        return;
    }

    process(files);
}

</script>
</body>
</html>

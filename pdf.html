<style>

:root{

--primary:#1565c0;
--primary-dark:#0d47a1;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;

--bg:#eef3f8;
--card:#ffffff;

--text:#1f2937;
--muted:#6b7280;

--border:#d7dde6;

--radius:18px;

--shadow:
0 10px 25px rgba(0,0,0,.12);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:var(--bg);
color:var(--text);

}

.container{

width:min(1450px,96%);
margin:auto;
padding:20px;

}

header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:28px;

border-radius:20px;

box-shadow:var(--shadow);

}

header h1{

font-size:30px;

}

header p{

margin-top:8px;
opacity:.95;
line-height:1.6;

}

.grid{

display:grid;

grid-template-columns:
360px
1fr;

gap:20px;

margin-top:20px;

}

.panel{

background:white;

border-radius:18px;

padding:20px;

box-shadow:var(--shadow);

border:1px solid var(--border);

}

.sectionTitle{

font-size:19px;
font-weight:600;
margin-bottom:15px;

}

.dropArea{

border:3px dashed var(--primary);

border-radius:18px;

padding:35px;

text-align:center;

cursor:pointer;

transition:.25s;

background:#f7fbff;

}

.dropArea:hover{

background:#eef8ff;

}

.dropArea.active{

background:#d8edff;

border-color:var(--success);

}

.dropIcon{

font-size:58px;

margin-bottom:10px;

}

.dropText{

font-size:18px;

font-weight:600;

}

.small{

font-size:13px;

margin-top:10px;

color:var(--muted);

line-height:1.6;

}

input[type=file]{

display:none;

}

button{

width:100%;

border:none;

cursor:pointer;

padding:13px;

font-size:15px;

font-weight:600;

border-radius:12px;

margin-top:12px;

transition:.25s;

}

.primary{

background:var(--primary);

color:white;

}

.primary:hover{

background:var(--primary-dark);

}

.secondary{

background:#eceff1;

color:#222;

}

.secondary:hover{

background:#dfe5ea;

}

.infoGrid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

margin-top:18px;

}

.infoCard{

background:#f8fafc;

border:1px solid var(--border);

padding:15px;

border-radius:15px;

text-align:center;

}

.infoCard h2{

font-size:24px;

margin-bottom:5px;

}

.progressWrap{

margin-top:18px;

}

.progressBar{

height:14px;

background:#dce4ef;

border-radius:999px;

overflow:hidden;

}

.progress{

height:100%;

width:0%;

background:
linear-gradient(
90deg,
#1565c0,
#42a5f5
);

transition:.30s;

}

.progressLabel{

margin-top:8px;

font-size:14px;

font-weight:600;

}

.viewer{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));

gap:16px;

margin-top:20px;

}
  .card{

background:#fff;

border-radius:16px;

overflow:hidden;

border:1px solid var(--border);

box-shadow:0 5px 15px rgba(0,0,0,.08);

transition:.25s;

}

.card:hover{

transform:translateY(-4px);

box-shadow:0 12px 25px rgba(0,0,0,.15);

}

.card img{

width:100%;

display:block;

cursor:pointer;

}

.cardBody{

padding:12px;

}

.fileName{

font-size:13px;

font-weight:600;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;

margin-bottom:6px;

}

.pageBadge{

display:inline-block;

padding:4px 10px;

border-radius:999px;

background:#e3f2fd;

color:#1565c0;

font-size:12px;

font-weight:700;

margin-top:5px;

}

.status{

margin-top:8px;

font-size:12px;

color:var(--muted);

word-break:break-word;

}

.tableWrap{

margin-top:20px;

overflow:auto;

border-radius:16px;

border:1px solid var(--border);

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

thead{

background:#1565c0;

color:white;

}

th,td{

padding:12px;

border-bottom:1px solid #e5e7eb;

text-align:left;

font-size:14px;

}

tbody tr:hover{

background:#f8fbff;

}

.badge{

display:inline-flex;

align-items:center;

justify-content:center;

padding:4px 10px;

border-radius:999px;

font-size:12px;

font-weight:700;

}

.success{

background:#dcfce7;

color:#166534;

}

.warning{

background:#fef3c7;

color:#92400e;

}

.danger{

background:#fee2e2;

color:#991b1b;

}

.logBox{

margin-top:20px;

height:220px;

overflow:auto;

background:#0f172a;

color:#e2e8f0;

padding:15px;

border-radius:16px;

font-size:13px;

line-height:1.7;

font-family:Consolas,monospace;

}

.previewOverlay{

position:fixed;

left:0;

top:0;

right:0;

bottom:0;

display:none;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.88);

z-index:9999;

padding:20px;

}

.previewOverlay img{

max-width:96%;

max-height:96%;

border-radius:12px;

box-shadow:0 0 40px rgba(255,255,255,.2);

}
  
<div id="loader">

<div class="spinner"></div>

<p>Loading OCR Engine...</p>

</div>
  <(/style)>

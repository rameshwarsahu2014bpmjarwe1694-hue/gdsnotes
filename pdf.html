<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart OCR PDF (Sorted)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    padding: 20px;
}

progress {
    width: 100%;
    height: 20px;
}

button {
    margin-top: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<h2>Smart Image → Sorted PDF (OCR)</h2>

<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">Waiting...</p>

<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>

let progress = 0;

/* ---------------- PROGRESS ---------------- */
function updateProgress(msg, value) {
    document.getElementById("progressBar").value = value;
    document.getElementById("progressText").innerText = `${msg} ${Math.round(value)}%`;
}

/* ---------------- BASE64 ---------------- */
function toBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

/* ---------------- IMAGE CLEAN ---------------- */
function prepareCanvasFromImage(img) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < data.data.length; i += 4) {
        let avg = (data.data[i] + data.data[i+1] + data.data[i+2]) / 3;
        avg = avg > 150 ? 255 : 0;

        data.data[i] = data.data[i+1] = data.data[i+2] = avg;
    }

    ctx.putImageData(data, 0, 0);

    return canvas;
}

/* ---------------- OCR ---------------- */
async function readPageNumber(img) {

    const h = img.height;
    const w = img.width;

    const canvas = prepareCanvasFromImage(img);

    const topCanvas = document.createElement("canvas");
    const bottomCanvas = document.createElement("canvas");

    topCanvas.width = w;
    topCanvas.height = h * 0.18;

    bottomCanvas.width = w;
    bottomCanvas.height = h * 0.18;

    const tctx = topCanvas.getContext("2d");
    const bctx = bottomCanvas.getContext("2d");

    tctx.drawImage(canvas, 0, 0, w, h * 0.18, 0, 0, w, h * 0.18);
    bctx.drawImage(canvas, 0, h * 0.82, w, h * 0.18, 0, 0, w, h * 0.18);

    const top = await Tesseract.recognize(topCanvas, "eng");
    const bottom = await Tesseract.recognize(bottomCanvas, "eng");

    const t = top.data.text.match(/\d+/);
    const b = bottom.data.text.match(/\d+/);

    if (t) return Number(t[0]);
    if (b) return Number(b[0]);

    return 999999;
}

/* ---------------- PDF ---------------- */
async function makePDF(images) {

    const { jsPDF } = window.jspdf;

    images.sort((a, b) => a.page - b.page);

    const pdf = new jsPDF();

    images.forEach((item, i) => {
        if (i > 0) pdf.addPage();

        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();

        pdf.addImage(item.data, "JPEG", 0, 0, w, h);
    });

    pdf.save("Sorted.pdf");
}

/* ---------------- PROCESS ---------------- */
async function process(files) {

    const arr = [];
    let done = 0;

    for (const file of files) {

        const url = URL.createObjectURL(file);

        const img = new Image();
        img.src = url;

        await new Promise(r => img.onload = r);

        const page = await readPageNumber(img);
        const base64 = await toBase64(file);

        URL.revokeObjectURL(url);

        arr.push({
            page,
            data: base64
        });

        done++;
        updateProgress("Processing", (done / files.length) * 100);
    }

    await makePDF(arr);
}

/* ---------------- START ---------------- */
function startProcess() {

    const files = document.getElementById("files").files;

    if (!files.length) {
        alert("Select images first");
        return;
    }

    process(files);
}

</script>

</body>
</html>

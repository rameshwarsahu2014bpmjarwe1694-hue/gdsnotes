<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart OCR PDF (Sorted)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
    /* Pure page ka background color set karne ke liye */
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 30px; 
        /* Yahan se background badlega (Dark Blue Gradient) */
        background: linear-gradient(135deg, #2c3e50, #000000); 
        color: #ffffff; /* Text color white kar diya taaki dark background pe dikhe */
        min-height: 100vh;
        margin: 0;
    }
    
    /* Brand Name Design */
    .brand-title {
        color: #f1c40f; /* Golden color for brand */
        text-align: center;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        border-bottom: 3px solid #f1c40f;
        padding-bottom: 10px;
        margin-bottom: 30px;
    }

    progress { width: 100%; height: 25px; border-radius: 10px; overflow: hidden; background: #eee; }

    /* 3D Colorful Buttons */
    button {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background: linear-gradient(to bottom, #e67e22, #d35400); /* Orange 3D */
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 6px #a04000; /* Darker shade for 3D effect */
        transition: all 0.2s;
    }
    button:active {
        box-shadow: 0 2px #a04000;
        transform: translateY(4px);
    }

    /* File input ko center karne ke liye */
    #files { display: block; margin: 20px auto; }
</style>
    
</head>

<body>

<h2>Smart Image → Sorted PDF (OCR)</h2>
    
<h3 class="brand-title">RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB</h3>

<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">Waiting...</p>

<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>
<script>
// Backend URL ko global variable bana diya
window.BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";

// Server par log bhejne ka function
async function logToServer(message) {
    try {
        await fetch(`${window.BACKEND_URL}/log`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ log: message })
        });
    } catch (e) {
        console.error("Server logging failed:", e);
    }
}


let progress = 0;

/* ---------------- PROGRESS ---------------- */
function updateProgress(msg, value) {
    document.getElementById("progressBar").value = value;
    document.getElementById("progressText").innerText = `${msg} ${Math.round(value)}%`;
}

/* ---------------- BASE64 ---------------- */
function toBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

/* ---------------- IMAGE CLEAN ---------------- */
function prepareCanvasFromImage(img) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < data.data.length; i += 4) {
        let avg = (data.data[i] + data.data[i+1] + data.data[i+2]) / 3;
        avg = avg > 150 ? 255 : 0;

        data.data[i] = data.data[i+1] = data.data[i+2] = avg;
    }

    ctx.putImageData(data, 0, 0);

    return canvas;
}

/* ---------------- FINAL: TOP & BOTTOM 50% SCAN LOGIC ---------------- */

async function readPageNumber(img, index) {
async function readPageNumber(img, index) {
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);

    const w = canvas.width;
    const h = canvas.height;
    
    // Top aur Bottom 50% scan area
    const areas = [
        { x: 0, y: 0, w: w, h: h * 0.5 },     // Top 50%
        { x: 0, y: h * 0.5, w: w, h: h * 0.5 } // Bottom 50%
    ];

    let matches = [];

    for (const area of areas) {
        const areaCanvas = document.createElement("canvas");
        areaCanvas.width = area.w;
        areaCanvas.height = area.h;
        areaCanvas.getContext("2d").drawImage(canvas, area.x, area.y, area.w, area.h, 0, 0, area.w, area.h);
        
        const res = await Tesseract.recognize(areaCanvas, "eng");
        const text = res.data.text.toLowerCase();

        // Regex: (page )? (number)
        const regex = /(?:page\s*)?(\d+)/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
            // YAHAN Galti thi: match ki jagah match hona chahiye
            const val = Number(match); 
            
            // 1 se 500 ke beech ka valid page number
            if (val > 0 && val < 500) {
                matches.push(val);
            }
        }
    }

    // Agar number mil gaya to min return karo, nahi to index + 1000
    const finalPage = matches.length > 0 ? Math.min(...matches) : (1000 + index);
     // Console mein print karein
    console.log(`Image Index ${index} read as Page: ${finalPage}`);
    
    // Server par bhejein (agar backend support karta hai)
    logToServer(`Image Index ${index} read as Page: ${finalPage}`);
    return finalPage;
}


async function makePDF(allData) {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");

    for (let i = 0; i < allData.length; i++) {
        if (i > 0) pdf.addPage();
        // Original quality maintain
        pdf.addImage(allData[i].data, "JPEG", 0, 0, 210, 297, undefined, 'FAST');
    }
    pdf.save("Sorted_Pages.pdf");
}

async function process(files) {
    const fileList = Array.from(files);
    let allData = [];

    for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        const url = URL.createObjectURL(file);
        
        const img = new Image();
        img.src = url;
        await new Promise(r => img.onload = r);

        const page = await readPageNumber(img, i);
        const data = await toBase64(file); 
        URL.revokeObjectURL(url);
        
        allData.push({ page, data });
        updateProgress("Processing", ((i + 1) / fileList.length) * 100);
    }

    allData.sort((a, b) => a.page - b.page);
    await makePDF(allData);
}
/* ---------------- START ---------------- */
function startProcess() {

    const files = document.getElementById("files").files;

    if (!files.length) {
        alert("Select images first");
        return;
    }

    process(files);
}

</script>
</body>
</html>

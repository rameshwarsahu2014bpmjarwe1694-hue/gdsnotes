<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image to Sorted PDF (OCR)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    padding: 20px;
}
input {
    margin-bottom: 15px;
}
</style>
</head>

<body>

<h2>Image to Sorted PDF (OCR Page Detect)</h2>

<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>
async function readPageNumber(img) {
    const topCanvas = document.createElement("canvas");
    const bottomCanvas = document.createElement("canvas");

    const w = img.width;
    const h = img.height;

    topCanvas.width = w;
    topCanvas.height = h * 0.18;

    bottomCanvas.width = w;
    bottomCanvas.height = h * 0.18;

    const tctx = topCanvas.getContext("2d");
    const bctx = bottomCanvas.getContext("2d");

    tctx.drawImage(img, 0, 0, w, h * 0.18);

    bctx.drawImage(
        img,
        0,
        h * 0.82,
        w,
        h * 0.18,
        0,
        0,
        w,
        h * 0.18
    );

    const top = await Tesseract.recognize(topCanvas, "eng");
    const bottom = await Tesseract.recognize(bottomCanvas, "eng");

    const t = top.data.text.match(/\d+/);
    const b = bottom.data.text.match(/\d+/);

    if (t && b) {
        if (Number(t[0]) === Number(b[0]))
            return Number(t[0]);
        return Number(t[0]);
    }

    if (t) return Number(t[0]);
    if (b) return Number(b[0]);

    return null;
}

async function makePDF(images) {
    const { jsPDF } = window.jspdf;

    images.sort((a, b) => a.page - b.page);

    const pdf = new jsPDF();

    images.forEach((item, index) => {
        if (index > 0) pdf.addPage();

        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();

        pdf.addImage(
            item.data,
            "JPEG",
            0,
            0,
            w,
            h,
            "",
            "FAST"
        );
    });

    pdf.save("Sorted.pdf");
}

async function process(files) {
    const arr = [];

    for (const file of files) {
        const img = new Image();
        img.src = URL.createObjectURL(file);

        await new Promise(r => img.onload = r);

        const page = await readPageNumber(img);

        arr.push({
            page,
            data: img.src
        });
    }

    await makePDF(arr);
}

function startProcess() {
    const files = document.getElementById("files").files;
    if (!files.length) {
        alert("Select images first");
        return;
    }
    process(files);
}
</script>

</body>
</html>

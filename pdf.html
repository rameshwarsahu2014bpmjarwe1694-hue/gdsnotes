<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image to Sorted PDF (OCR)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    padding: 20px;
}
input {
    margin-bottom: 15px;
}
</style>
</head>

<body>

<h2>Image to Sorted PDF (OCR Page Detect)</h2>
<progress id="progressBar" value="0" max="100" style="width:100%; height:20px;"></progress>
<p id="progressText">Waiting...</p>
<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>
    function updateProgress(msg, value) {
    const bar = document.getElementById("progressBar");
    const text = document.getElementById("progressText");

    bar.value = value;
    text.innerText = `${msg} - ${Math.round(value)}%`;
}
    let currentProgress = 0;

function smoothProgress(target) {
    let currentProgress = 0;

function smoothProgress(target) {
    const bar = document.getElementById("progressBar");

    const interval = setInterval(() => {
        if (currentProgress >= target) {
            clearInterval(interval);
            return;
        }

        currentProgress += 1;
        bar.value = currentProgress;
    }, 10);
}
    const bar = document.getElementById("progressBar");

    const interval = setInterval(() => {
        if (currentProgress >= target) {
            clearInterval(interval);
            return;
        }

        currentProgress += 1;
        bar.value = currentProgress;
    }, 10);
}
    function prepareCanvasFromImage(img, scale = 1) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width * scale;
    canvas.height = img.height * scale;

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // grayscale + contrast boost
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i+1] + data[i+2]) / 3;

        // grayscale
        avg = avg * 1.2; // contrast boost

        avg = avg > 140 ? 255 : 0; // threshold clean text

        data[i] = data[i+1] = data[i+2] = avg;
    }

    ctx.putImageData(imgData, 0, 0);

    return canvas;
    }
    
async function readPageNumber(img) {

    // STEP 1 preprocessing (top & bottom crop ke liye canvas banayenge)
    const w = img.width;
    const h = img.height;

    const topImg = new Image();
    const bottomImg = new Image();

    // temporary canvas for cropping
    const tempCanvas = document.createElement("canvas");
    const ctx = tempCanvas.getContext("2d");

    tempCanvas.width = w;
    tempCanvas.height = h;

    ctx.drawImage(img, 0, 0);

    // TOP crop canvas
    const topCanvas = document.createElement("canvas");
    topCanvas.width = w;
    topCanvas.height = h * 0.18;

    const tctx = topCanvas.getContext("2d");
    tctx.drawImage(tempCanvas, 0, 0, w, h * 0.18, 0, 0, w, h * 0.18);

    // BOTTOM crop canvas
    const bottomCanvas = document.createElement("canvas");
    bottomCanvas.width = w;
    bottomCanvas.height = h * 0.18;

    const bctx = bottomCanvas.getContext("2d");
    bctx.drawImage(tempCanvas, 0, h * 0.82, w, h * 0.18, 0, 0, w, h * 0.18);

    // 🔥 APPLY PREPROCESSING (STEP 1 FUNCTION USE)
    const cleanTop = prepareCanvasFromImage(topCanvas, 1);
    const cleanBottom = prepareCanvasFromImage(bottomCanvas, 1);

    // OCR RUN
    const top = await Tesseract.recognize(cleanTop, "eng");
    const bottom = await Tesseract.recognize(cleanBottom, "eng");

    const t = top.data.text.match(/\d+/);
    const b = bottom.data.text.match(/\d+/);

    if (t && b) {
        return Number(t[0]);
    }

    if (t) return Number(t[0]);
    if (b) return Number(b[0]);

    return null;
}

    const top = await Tesseract.recognize(topCanvas, "eng");
    const bottom = await Tesseract.recognize(bottomCanvas, "eng");

    const t = top.data.text.match(/\d+/);
    const b = bottom.data.text.match(/\d+/);

    if (t && b) {
        if (Number(t[0]) === Number(b[0]))
            return Number(t[0]);
        return Number(t[0]);
    }

    if (t) return Number(t[0]);
    if (b) return Number(b[0]);

    return null;
}

async function makePDF(images) {
    const { jsPDF } = window.jspdf;

    images.sort((a, b) => a.page - b.page);

    const pdf = new jsPDF();

    images.forEach((item, index) => {
        if (index > 0) pdf.addPage();

        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();

        pdf.addImage(
            item.data,
            "JPEG",
            0,
            0,
            w,
            h,
            "",
            "FAST"
        );
    });

    pdf.save("Sorted.pdf");
}

async function process(files) {
    const arr = [];

    // 🚀 parallel OCR tasks
    const tasks = [...files].map(async (file) => {

        const img = new Image();
        img.src = URL.createObjectURL(file);

        await new Promise(r => img.onload = r);

        const page = await readPageNumber(img);

        // memory cleanup (IMPORTANT)
        URL.revokeObjectURL(img.src);

        return {
            page,
            data: img.src
        };
    });

    const results = await Promise.all(tasks);

    arr.push(...results);

    await makePDF(arr);
}

function startProcess() {
    const files = document.getElementById("files").files;
    if (!files.length) {
        alert("Select images first");
        return;
    }
    process(files);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart OCR PDF (Sorted)</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
    /* Pure page ka background color set karne ke liye */
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 30px; 
        /* Yahan se background badlega (Dark Blue Gradient) */
        background: linear-gradient(135deg, #2c3e50, #000000); 
        color: #ffffff; /* Text color white kar diya taaki dark background pe dikhe */
        min-height: 100vh;
        margin: 0;
    }
    
    /* Brand Name Design */
    .brand-title {
        color: #f1c40f; /* Golden color for brand */
        text-align: center;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        border-bottom: 3px solid #f1c40f;
        padding-bottom: 10px;
        margin-bottom: 30px;
    }

    progress { width: 100%; height: 25px; border-radius: 10px; overflow: hidden; background: #eee; }

    /* 3D Colorful Buttons */
    button {
        display: block;
        width: 200px;
        margin: 20px auto;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background: linear-gradient(to bottom, #e67e22, #d35400); /* Orange 3D */
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 6px #a04000; /* Darker shade for 3D effect */
        transition: all 0.2s;
    }
    button:active {
        box-shadow: 0 2px #a04000;
        transform: translateY(4px);
    }

    /* File input ko center karne ke liye */
    #files { display: block; margin: 20px auto; }
</style>
    
</head>

<body>

<h2>Smart Image → Sorted PDF (OCR)</h2>
    
<h3 class="brand-title">RAMESHWAR SAHU GDS DEPARTMENTAL EXAM STUDY HUB</h3>

<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">Waiting...</p>

<input type="file" id="files" multiple accept="image/*">
<button onclick="startProcess()">Create PDF</button>

<script>

let progress = 0;

/* ---------------- PROGRESS ---------------- */
function updateProgress(msg, value) {
    document.getElementById("progressBar").value = value;
    document.getElementById("progressText").innerText = `${msg} ${Math.round(value)}%`;
}

/* ---------------- BASE64 ---------------- */
function toBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

/* ---------------- IMAGE CLEAN ---------------- */
function prepareCanvasFromImage(img) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < data.data.length; i += 4) {
        let avg = (data.data[i] + data.data[i+1] + data.data[i+2]) / 3;
        avg = avg > 150 ? 255 : 0;

        data.data[i] = data.data[i+1] = data.data[i+2] = avg;
    }

    ctx.putImageData(data, 0, 0);

    return canvas;
}

/* ---------------- OCR REFINED ---------------- */
async function readPageNumber(img) {
    const w = img.width;
    const h = img.height;
    const canvas = prepareCanvasFromImage(img);

    // Top aur Bottom ka area define karein
    const topCanvas = document.createElement("canvas");
    const bottomCanvas = document.createElement("canvas");
    
    topCanvas.width = w; topCanvas.height = h * 0.2;
    bottomCanvas.width = w; bottomCanvas.height = h * 0.2;

    const tctx = topCanvas.getContext("2d");
    const bctx = bottomCanvas.getContext("2d");

    // Top 20% aur Bottom 20% extract karein
    tctx.drawImage(canvas, 0, 0, w, h * 0.2, 0, 0, w, h * 0.2);
    bctx.drawImage(canvas, 0, h * 0.8, w, h * 0.2, 0, 0, w, h * 0.2);

    const topRes = await Tesseract.recognize(topCanvas, "eng");
    const bottomRes = await Tesseract.recognize(bottomCanvas, "eng");

    // Number dhoondhne ka regex (sirf digits)
    const tMatch = topRes.data.text.match(/\d+/);
    const bMatch = bottomRes.data.text.match(/\d+/);

    // Priority logic: Agar Top mein mil gaya to wo, varna Bottom ka
    if (tMatch) return Number(tMatch);
    if (bMatch) return Number(bMatch);

    return 999999; // Agar kuch nahi mila
}

/* ---------------- PDF ---------------- */
async function makePDF(images) {

    const { jsPDF } = window.jspdf;

    images.sort((a, b) => a.page - b.page);

    const pdf = new jsPDF();

    images.forEach((item, i) => {
        if (i > 0) pdf.addPage();

        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();

        pdf.addImage(item.data, "JPEG", 0, 0, w, h);
    });

    pdf.save("Sorted.pdf");
}

/* ---------------- PROCESS REFINED ---------------- */
async function process(files) {
    const arr = [];
    let done = 0;

    for (const file of files) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.src = url;
        await new Promise(r => img.onload = r);

        const page = await readPageNumber(img);
        const base64 = await toBase64(file);
        URL.revokeObjectURL(url);

        // Sirf unhi ko lein jo valid page number hain, 
        // ya agar page number nahi mila to use manual review ke liye end mein rakhein
        arr.push({ page, data: base64, originalName: file.name });
        
        done++;
        updateProgress("Processing", (done / files.length) * 100);
    }

    // SORTING LOGIC: Page numbers ke according sort karein
    arr.sort((a, b) => a.page - b.page);

    // DEDUPLICATION: Agar same page number do baar aaye to pehla wala rakhein
    const finalArr = [];
    const seen = new Set();
    
    arr.forEach(item => {
        if (!seen.has(item.page)) {
            finalArr.push(item);
            seen.add(item.page);
        }
    });

    await makePDF(finalArr);
    alert("PDF " + finalArr.length + " pages ke saath generate ho gayi!");
}


/* ---------------- START ---------------- */
function startProcess() {

    const files = document.getElementById("files").files;

    if (!files.length) {
        alert("Select images first");
        return;
    }

    process(files);
}

</script>

</body>
</html>
